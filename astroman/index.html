<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mars">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
</head>
<body>
<title>Mars · Astroman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Enterprise dark: neutral near-black surfaces, hairline borders, one sans family with tabular numbers,
   indigo for data and selection, amber for the one primary action. Light mode (Settings → Appearance) keeps the same tokens. */
:root{
  --bg:#0B0D12; --surface:#13161D; --surface-2:#1B1F28; --surface-3:#252A36; --ink:#E9ECF3; --ink-2:#B6BCC9; --muted:#8A92A6; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --brand:#7C8CF8; --brand-ink:#0B0D12; --brand-bg:rgba(124,140,248,.14); --accent:#F5A623; --accent-ink:#1A1300; --accent-hover:#FFB640;
  --rail-bg:#0B0D12; --rail-ink:#E9ECF3; --rail-muted:#7E8699; --rail-line:rgba(255,255,255,.08);
  --night:#0B0D12; --night-2:#13161D; --night-ink:#E9ECF3; --night-muted:#8A92A6;
  --good:#4CC38A; --warn:#E0A531; --bad:#F2695C; --good-bg:rgba(76,195,138,.14); --warn-bg:rgba(224,165,49,.14); --bad-bg:rgba(242,105,92,.14);
  --s1:#7C8CF8; --s2:#D9A03A; --grid:rgba(255,255,255,.06); --shadow:none;
  --glass:var(--surface);
  --f-ui:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:var(--f-ui);
  --f-display:var(--f-ui);
  --r:12px; --ease:cubic-bezier(.2,.7,.2,1); color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#F0F2F6; --surface-3:#E4E7EE; --ink:#151A26; --ink-2:#4A5165; --muted:#6E7689; --line:#E1E4EB; --line-2:#CDD2DC;
  --brand:#3D52D5; --brand-ink:#FFFFFF; --brand-bg:rgba(61,82,213,.1);
  --rail-bg:#FFFFFF; --rail-ink:#151A26; --rail-muted:#6E7689; --rail-line:#E1E4EB;
  --night:#FFFFFF; --night-2:#F0F2F6; --night-ink:#151A26; --night-muted:#6E7689;
  --good:#1E8A55; --warn:#A86A12; --bad:#C4382C; --good-bg:#E3F4EA; --warn-bg:#FBF0DC; --bad-bg:#FBE5E2;
  --s1:#3D52D5; --s2:#C27A06; --grid:#E8EBF1; --shadow:none; --glass:var(--surface); color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0;-webkit-tap-highlight-color:transparent;scrollbar-color:var(--surface-2) transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.content{min-width:0}
/* ---------- rail ---------- */
.rail{background:var(--rail-bg);border-right:1px solid var(--rail-line);color:var(--rail-ink);padding:16px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:2px 8px 6px}
.brand img{width:112px;height:auto;display:block}
:root[data-theme="light"] .brand img.lt{display:none}:root:not([data-theme="light"]) .brand img.dk{display:none}
.brand small{display:block;color:var(--accent);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.iconbtn{background:transparent;border:1px solid var(--line-2);color:var(--ink);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s}
.iconbtn:hover{background:var(--surface-2)}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu button{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;color:var(--rail-ink);padding:7px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:13.5px;font-weight:500;opacity:.82;transition:background .15s,opacity .15s}
nav.menu button svg{color:var(--rail-muted);flex:none}
nav.menu button:hover{background:var(--surface-2);opacity:1}
nav.menu button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--ink);opacity:1;font-weight:600}
nav.menu button[aria-current="page"] svg{color:var(--accent)}
nav.menu .sep{height:1px;background:var(--rail-line);margin:8px 6px}
nav.menu .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-muted);padding:4px 10px 4px;font-weight:600}
.rail .foot{margin-top:auto;font-size:11.5px;color:var(--rail-muted);padding:10px 12px;display:flex;flex-direction:column;gap:3px;border:1px solid var(--rail-line);border-radius:10px;background:var(--surface)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4CC38A;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 0 rgba(76,195,138,.6);animation:pulse 2.4s infinite}
.dot.off{background:#E2B04A;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 6px rgba(76,195,138,0)}100%{box-shadow:0 0 0 0 rgba(76,195,138,0)}}
/* ---------- top bar: month, sync, recap, add ---------- */
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;padding:10px clamp(16px,3vw,40px);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .tbrand{display:none;width:28px;height:28px;flex:none}
.monthdial{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);height:36px;overflow:hidden;flex:none}
.monthdial label{display:none}
.monthdial .row{display:flex;align-items:center;height:100%}
.monthdial select{background:transparent;border:0;color:var(--ink);font-weight:600;font-size:13.5px;padding:0 8px;min-width:118px;text-align:center;cursor:pointer;height:100%;appearance:none;-webkit-appearance:none}
.monthdial select option{color:#111;background:#fff}
.monthdial .iconbtn{border:0;border-radius:0;height:100%;width:34px}.monthdial .iconbtn:first-child{border-right:1px solid var(--line)}.monthdial .iconbtn:last-child{border-left:1px solid var(--line)}
.topbar .ago{font-size:12px;color:var(--muted);white-space:nowrap}
.topbar .spacer{flex:1}
/* ---------- main ---------- */
main{padding-block:24px 80px;padding-inline:clamp(16px,3vw,40px);min-width:0}
main:focus{outline:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1,.modal h3,.empty b,.rh,.rh3{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em}
.pagehead h1{margin:0;font-size:30px;line-height:1.1;text-wrap:balance}
.pagehead p{margin:6px 0 0;color:var(--ink-2);max-width:64ch}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:8px;height:36px;padding:0 14px;cursor:pointer;font-weight:600;font-size:13px;line-height:1;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-3)}
.btn:active{background:var(--surface-2)}
:root[data-theme="light"] .btn:not(.primary):not(.amber):not(.brand):not(.danger):not(.ghost){background:#fff}
:root[data-theme="light"] .btn:not(.primary):not(.amber):not(.brand):not(.danger):not(.ghost):hover{background:var(--surface-2)}
.btn.primary,.btn.amber{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover,.btn.amber:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.brand{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:transparent}.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.panel h2{margin:0 0 3px;font-size:15px;font-weight:700}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 10px}.sech h2{margin:0;font-size:15px;font-weight:700}.sech span{font-size:12.5px;color:var(--muted)}.sech span b{color:var(--ink);font-weight:700}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g3b{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.mt{margin-top:16px}
@media (max-width:1100px){.g3,.g3b{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.g2{grid-template-columns:minmax(0,1fr)}}
/* ---------- month panel ---------- */
.mp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.mp .kpis{border:0;border-radius:0;margin:0;background:transparent;box-shadow:none}
.mp .kpi .lbl{font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted)}
.mp .kpi .val{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.mp .kpi .val small{font-size:14px;color:var(--muted);margin-left:4px;font-weight:600}
.mp .kpi .delta{font-size:12px;color:var(--ink-2);margin-top:4px}.mp .kpi .delta em{font-style:normal;color:var(--accent);font-weight:600}
.pace{border-top:1px solid var(--line);padding:12px 18px}
.pace .ph{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}.pace .ph b{color:var(--ink);font-weight:700}.pace .ph .num{font-weight:700;color:var(--ink)}
.ptrack{position:relative;height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.ptrack i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:5px}
.ptrack i.fc{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--brand) 40%,transparent) 0 6px,transparent 6px 9px)}
.ptrack em{position:absolute;top:0;bottom:0;width:2px;background:var(--good)}
.plg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}.plg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.deep{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.dcard{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit;min-width:0;transition:border-color .15s,background .15s}
.dcard:hover{border-color:var(--line-2);background:var(--surface-2)}
.dcard .dic{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--brand)}
.dcard .dt{min-width:0;display:flex;flex-direction:column}.dcard b{font-size:13.5px;font-weight:700}.dcard small{color:var(--muted);font-size:12px;line-height:1.35}
.dcard .dgo{margin-left:auto;color:var(--muted);flex:none}
.deepm .panel{border:0;padding:0;background:transparent;box-shadow:none}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.mcard{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.mcard .lbl span:first-child::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--brand));margin-right:7px;vertical-align:1px}
.mcard .lbl{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mcard .val{font-size:23px;font-weight:600;margin-top:2px}
.mcard .val small{font-size:14px;color:var(--muted);margin-left:2px}
.mcard .parts{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.55}
.mcard .bar2{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.mcard .bar2 i{display:block;height:100%;background:var(--c,var(--accent));transform-origin:left}
@media (max-width:1000px){.money{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.money{grid-template-columns:minmax(0,1fr)}}
.tag{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:999px;background:var(--brand-bg);color:var(--brand);font-weight:700}
/* ---------- kpi strip (light) ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--glass);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.kpi{padding:18px 20px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .lbl{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kpi .val{font-size:27px;font-weight:500;margin-top:4px;line-height:1.15}
.kpi .val small{font-size:15px;color:var(--muted);font-weight:500;margin-left:2px}
.kpi .delta{font-size:12px;margin-top:3px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)} .neg{color:var(--bad)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
/* ---------- flow ---------- */
.flow{display:flex;flex-direction:column}
.flow .ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.flow .ln:last-child{border-bottom:0}
.flow .ln .k{color:var(--ink-2)}
.flow .ln.total{border-bottom:1px solid var(--line);border-top:1px solid var(--ink);margin-top:4px;padding-top:9px}
.flow .ln.total .k{color:var(--ink);font-weight:700}
.flow .ln.total .v{font-weight:600}
.flow .ln.minor .k{padding-left:14px;font-size:13px}
.flow .ln.minor .v{color:var(--ink-2);font-size:13px}
.flow .group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:14px;padding-bottom:2px;font-weight:600}
/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;border-radius:6px}
.bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar .name span{color:var(--muted);font-size:11.5px;margin-left:4px}
.bar .track{height:10px;background:var(--surface-2);border-radius:0 4px 4px 0;overflow:hidden}
.bar .fill{height:100%;border-radius:0 4px 4px 0;min-width:2px;transform-origin:left center}
.bar .amt{text-align:right;min-width:92px}
.bar .amt small{display:block;font-size:11px;color:var(--muted)}
.bar.click{cursor:pointer}.bar.click:hover .name{color:var(--ink)}
@media (max-width:520px){.bar{grid-template-columns:minmax(0,1fr) auto}.bar .track{grid-column:1/-1;grid-row:2}}
/* ---------- chips, alerts ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.goods{border-color:color-mix(in srgb,var(--s2) 45%,transparent)}
.chip.tax{border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.chip.below{border-style:dashed;border-color:var(--muted)}
.chip.fixed{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;background:var(--surface-2);font-size:13px}
.alert .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.alert.warn .ic{background:var(--warn-bg);color:var(--warn)}
.alert.bad .ic{background:var(--bad-bg);color:var(--bad)}
.alert.good .ic{background:var(--good-bg);color:var(--good)}
.alert.info .ic{background:var(--surface);color:var(--brand)}
.alert b{font-weight:600}
/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--glass);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0;white-space:nowrap;z-index:1}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--ink)}
th.sorted{color:var(--brand)}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tr.click{cursor:pointer}
tr.virtual td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.pl td,.pl th{white-space:nowrap}
.pl td:first-child,.pl th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px}
.pl tr.sec td{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:16px}
.pl tr.sum td{font-weight:700;border-top:1px solid var(--ink)}
.pl tr.sum.big td,.pl tr.sum.big td:first-child{font-size:14px;background:var(--surface-2)}
.pl td.cur{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.pl tr.ind td:first-child{padding-left:26px;color:var(--ink-2)}
.pl tr.info td{color:var(--muted);font-size:12.5px}
.odot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:2px}
/* ---------- imports ---------- */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stage{position:relative;text-align:left;border:1px solid var(--line);background:var(--glass);border-radius:var(--r);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);font:inherit;min-width:0;transition:border-color .15s,transform .12s}
.stage:hover{border-color:var(--brand)}
.stage .lbl{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.stage .n{font-family:var(--f-num);font-size:26px;margin-top:6px;line-height:1.1}
.stage .v{font-size:13px;color:var(--ink-2);margin-top:2px;font-family:var(--f-num)}
.stage .hint{margin-top:2px}
.stage:not(:last-child)::after{content:'';position:absolute;right:-10px;top:50%;width:6px;height:6px;border-top:1.5px solid var(--muted);border-right:1.5px solid var(--muted);transform:translateY(-50%) rotate(45deg)}
@media (max-width:820px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stage::after{display:none}.stage .n{font-size:22px}}

.rep{--ink:#E9ECF3;--ink-2:#B6BCC9;--muted:#8A92A6;--line:rgba(255,255,255,.12);--surface:#13161D;--surface-2:rgba(255,255,255,.08);--glass:rgba(19,22,29,.7);--grid:rgba(176,196,255,.1);--good:#5BD398;--warn:#E8B860;--bad:#FF8A7E;--good-bg:#12301F;--warn-bg:#33270F;--bad-bg:#3A1714;--s1:#7B9CF5;--s2:#D9A03A;--c1:#7B9CF5;--c2:#5BD398;--c3:#F5A623;--c4:#B18CFF;--c5:#4FC9D9;--c6:#FF8FB1;--c7:#E8D27A;--c8:#8EA0C8;color-scheme:dark;position:fixed;inset:0;z-index:80;background:radial-gradient(90% 70% at 80% 0%,#1C2140 0%,#0B0D12 70%);color:#E9ECF3;display:flex;flex-direction:column;animation:fade .3s both;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ---------- motion ---------- */
@media (prefers-reduced-motion:no-preference){
  .anim .rise{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
  .anim .fill{animation:growx .8s var(--ease) both;animation-delay:calc(120ms + var(--j,0) * 35ms)}
  .anim .gy{transform-box:fill-box;transform-origin:50% 100%;animation:growy .7s var(--ease) both;animation-delay:calc(var(--j,0) * 45ms)}
  .anim .bub{transform-box:fill-box;transform-origin:center;animation:popin .5s var(--ease) both;animation-delay:calc(var(--j,0) * 12ms)}
  .anim .meter i{animation:growx .9s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
  @keyframes growx{from{transform:scaleX(0)}}
  @keyframes growy{from{transform:scaleY(0)}}
  @keyframes popin{from{transform:scale(0);opacity:0}}
  .panel{transition:box-shadow .2s,transform .2s,border-color .2s}
  .panel.lift:hover{border-color:var(--line-2)}
}

    if(j.error==='bad_key')throw {code:'bad_key',message:'Wrong secret key'};if(j.error)throw {message:j.error};return j;

  let seq=outbox.reduce((m,o)=>Math.max(m,o.q||0),0);
  const col=c=>cols.get(c)||(cols.set(c,new Map()),cols.get(c));
  const fire=l=>{if(l.kind==='c')l.cb({docs:[...col(l.path)].map(([id,d])=>({id,exists:true,data:()=>d})),size:col(l.path).size,empty:!col(l.path).size});else{const [c,id]=l.path.split('/');const d=col(c).get(id);l.cb({id,exists:!!d,data:()=>d})}};
  const emit=()=>L.forEach(fire);
  const saveOutbox=()=>{try{localStorage.setItem(OUTBOX,JSON.stringify(outbox))}catch(e){toast('This device is out of storage space. Keep the page open until it says “Saved to Google”.')}};
  let cacheT=0;const saveCache=()=>{clearTimeout(cacheT);cacheT=setTimeout(()=>{const docs=[];cols.forEach((m,c)=>m.forEach((d,id)=>docs.push([c,id,d])));try{localStorage.setItem(CACHE,JSON.stringify({u,at:since,docs}))}catch(e){try{localStorage.removeItem(CACHE)}catch(e2){}}},800)};
  const apply=op=>{if(op.op==='delete')col(op.c).delete(op.id);else col(op.c).set(op.id,op.d)};
  const docId=x=>{let id=String(x.id);if((x.c==='sales'||x.c==='items')&&x.d&&/^\d{4}-\d{2}$/.test(x.d.month||''))id=x.d.month;return id};

      const done=new Set(batch.map(o=>o.q));outbox=outbox.filter(o=>!done.has(o.q));saveOutbox();fails=0;busy=false;status();
      if(outbox.length)flush();}

  // rewriting a row can miss that row. Removals (an expense deleted on another device) arrive with the
  // full reload, done on every open and every 30 minutes; a full reload that comes back much smaller
  // than what we have is treated as a bad read and ignored.
  let lastFull=0;

  const api={
    collection:path=>({onSnapshot(cb,err){const l={kind:'c',path,cb,err};L.push(l);if(loaded)fire(l);return()=>{}}}),
    doc:path=>{const [c,id]=path.split('/');return {

      delete:async()=>push({op:'delete',c,id}),
      get:async()=>{const d=col(c).get(id);return {id,exists:!!d,data:()=>d}},
      onSnapshot(cb){const l={kind:'d',path,cb};L.push(l);if(loaded)fire(l);return()=>{}}}},
    load,fromCache,flush,pending:()=>outbox.length||busy,
    orders:async sheetId=>{const r=await gasCall(u,k,{action:'orders',sheetId});if(!Array.isArray(r.sheets))throw {message:'Google sent an incomplete answer — try again'};return r},
    importAll:async(docs,onStep)=>{busy=true;try{await writeOps(u,k,docs.map(x=>({op:'set',c:x.c,id:String(x.id),d:x.d})),onStep)}finally{busy=false}await load(true)},
  };

  const refresh=()=>{if(document.hidden)return;flush();if(!busy)load().then(autoSyncSales).catch(()=>{})};

  return api;
}
// One sync makes the app match the order sheet: every month of this year that comes from a monthly tab is
// replaced by what the sheet holds now, a month that is no longer in the sheet is removed, and months
// uploaded from a file or kept as history are left alone. The automatic sync (whenever the app is open,
// at most every 5 minutes) skips a month that shrank by more than a third, in case Google sent a partial
// read; the Sync button replaces it anyway, so what you see is always what the sheet says.
async function applySheet(P,manual){
  const y=String(new Date().getFullYear());
  const months=P.months.filter(m=>m.m.startsWith(y)&&m.tabs.some(t=>tabYM(t,+y)));
  const seen=new Set(months.map(m=>m.m));const done=[],held=[];
  for(const m of months){
    const old=S.sales.get(m.m);
    if(old&&(old.locked||old.hist))continue;
    if(old&&m.oldTotal!=null&&Math.abs(m.total-m.oldTotal)<0.01&&m.count===m.oldCount)continue;
    if(!manual&&old&&m.count<old.rows.length*0.67){held.push(m);continue}
    await S.db.doc('sales/'+m.m).set(salesDoc(m,'Google Sheet'));done.push(m);
  }
  for(const [k,old] of [...S.sales]){
    if(k.startsWith(y)&&!seen.has(k)&&/^Google Sheet/.test(old.source||'')&&!old.locked&&!old.hist){await S.db.doc('sales/'+k).delete();done.push({m:k,gone:true})}
  }
  lsSet('af.salesAt',String(Date.now()));
  return {done,held,typos:P.typos||0};
}
function syncSummary(r,manual){
  const parts=[];
  if(r.done.length)parts.push('Synced with the sheet: '+r.done.map(m=>m.gone?mShort(m.m)+' removed':mShort(m.m)+' '+m.count+' orders · '+gel(m.total)).join(', '));
  else if(manual)parts.push('Already in sync with the sheet');
  if(r.typos)parts.push(r.typos+' order'+(r.typos>1?'s have':' has')+' a mistyped month in the sheet; counted by tab');
  if(manual&&r.held.length)parts.push('Not replaced: '+r.held.map(m=>mShort(m.m)).join(', '));
  return parts.join('. ');
}

let starRAF=0;
function starfield(cv){
  cancelAnimationFrame(starRAF);if(!cv)return;const ctx=cv.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);
  const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const stars=Array.from({length:Math.round(W*H/2600)},()=>({x:rnd()*W,y:rnd()*H,r:rnd()*1.2+.25,p:rnd()*6.28,s:.4+rnd()*1.4}));
  const draw=t=>{ctx.clearRect(0,0,W,H);for(const s of stars){const a=.35+.45*Math.sin(s.p+t*.0012*s.s);ctx.globalAlpha=Math.max(.08,a);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()}
    ctx.globalAlpha=1;};
  if(reduced()){draw(0);return}
  const loop=t=>{if(!document.body.contains(cv))return;if(!document.hidden)draw(t);starRAF=requestAnimationFrame(loop)};starRAF=requestAnimationFrame(loop);
}

  const fc=live&&day?M.sales/day*dim:M.sales,tgt=DAY_TARGET*dim,margin=M.sales?M.gross/M.sales:0;
  const be=live&&M.net<0&&margin>0?M.sales+(-M.net)/margin:0;const beDay=be&&M.sales?Math.ceil(be/(M.sales/day)):0;

   <div class="kpi"><div class="lbl">Gross profit</div><div class="val num">${cu(M.gross)}<small>₾</small></div><div class="delta">${M.sales?pct(M.gross,M.sales)+'% margin':'—'}${M.est&&M.sales?' · <em>cost estimated</em>':''}</div></div>
   <div class="kpi"><div class="lbl">Running costs</div><div class="val num">${cu(M.opex)}<small>₾</small></div><div class="delta">${live&&M.fixed?(M.fixed>=M.opex-1?'All fixed, booked for the full month':gel(M.fixed)+' fixed, booked for the full month'):live?'so far this month':(d(M.opex,P.opex,true)||'—')}</div></div>
   <div class="kpi"><div class="lbl">Net profit</div><div class="val num ${M.net<0?'neg':''}">${cu(M.net)}<small>₾</small></div><div class="delta">${be?'Positive after ≈ '+gel(be)+' in sales':live?'so far this month':(d(M.net,P.net)||'—')}</div></div>
  </div>`;
  const pace=live?`<div class="pace"><div class="ph"><b>Month pace</b><span>At <span class="num">${gel(M.sales/Math.max(1,day))}</span> a day, ${mShort(m)} ends near <span class="num">${gel(fc)}</span> · target <span class="num">${gel(tgt)}</span></span></div>
   <div class="ptrack"><i class="fc" style="width:${W(fc)}%"></i><i style="width:${W(M.sales)}%"></i>${be&&be<max?`<em style="left:${W(be)}%"></em>`:''}</div>
   <div class="plg"><span><i style="background:var(--brand)"></i>So far ${gel(M.sales)}</span>${be?`<span><i style="background:var(--good)"></i>Break-even ≈ ${gel(be)}${beDay&&beDay<=dim?' · around '+beDay+' '+mShort(m):''}</span>`:''}<span><i style="background:color-mix(in srgb,var(--brand) 40%,transparent)"></i>Forecast ${gel(fc)}</span><span>Bar ends at the ${gel(max)} ${fc>tgt?'forecast':'target'}</span></div></div>`
   :`<div class="pace"><div class="ph"><b>${mLabel(m)}</b><span>${M.orders} orders · ${pct(M.sales,tgt)}% of the ${gel(tgt)} target${P.sales?' · '+(d(M.sales,P.sales)||''):''}</span></div><div class="ptrack"><i style="width:${W(M.sales)}%"></i></div></div>`;

function sparkline(vals,cls){

function optLoad(wb,fileName){

  const header=aoa[hi].map(c=>String(c).trim());const rows=aoa.slice(hi+1);const map={};const taken=new Set();
  const pick=(k,ex)=>{const i=header.findIndex((h,i)=>!taken.has(i)&&OKW[k].test(h)&&!(ex&&ex.test(h)));if(i>=0)taken.add(i);map[k]=i};

/* ---------- order sheet parsing ---------- */
function normPay(s){s=String(s||'').trim().toLowerCase();if(!s||s==='აირჩიე')return 'unknown';
  const map=[['ტერმინ','pos'],['terminal','pos'],['საქართველოს ბანკ','bog'],['bog','bog'],['თბს','tbc'],['tbc','tbc'],['wolt','wolt'],['ვოლტ','wolt'],['გლოვო','glovo'],['glovo','glovo'],['ნაღდ','cash'],['cash','cash'],['პირად','personal'],['ექსტრ','extra'],['extra','extra'],['ადგილზე','cod'],['ჩასარიცხ','pending'],['ნაწილ','installment'],['განვად','installment']];

function tabYM(name,defY){let m=0;KA_MONTHS.forEach((k,i)=>{if(name.includes(k))m=i+1});const y=(name.match(/20\d\d/)||[])[0];return m?{y:y?+y:(m>new Date().getMonth()+1?defY-1:defY),m}:null}

    if(/income statement|შემოსავლები/i.test(aoa.slice(0,8).flat().join(' ')))continue;   // monthly income-statement tabs

    const payS=score(v=>{const p=normPay(v);return p!=='unknown'&&p!=='other'});
    if(amtCol<0){const numS=score(v=>{const n=typeof v==='number'?v:parseNum(v);return n>=5&&n<100000});amtCol=best(numS,[best(dateS)])}
    const dateCol=best(dateS,[amtCol]);const payCol=hdrIdx(/გადახდ|payment/)>=0?hdrIdx(/გადახდ|payment/):best(payS,[amtCol,dateCol]);
    let custCol=hdrIdx(/დამკვეთ|customer|client/),prodCol=hdrIdx(/პროდუქტ|product|item|დასახელ/);

function findSheetText(x,d=0){if(d>6||x==null)return null;if(typeof x==='string')return x.includes('## Sheet name:')?x:null;if(typeof x==='object'){for(const k of Object.keys(x)){const r=findSheetText(x[k],d+1);if(r)return r}}return null}
function findB64(x,depth=0){

function wbFromText(text){
  text=text.replace(/^﻿/,'');const wb=XLSX.utils.book_new();
  const parts=text.split(/^## Sheet name:\s*(.*)$/m);
  if(parts.length<3)return XLSX.read(text,{type:'string',raw:true});
  const used=new Set();
  for(let i=1;i<parts.length;i+=2){let name=(parts[i]||'Sheet').trim().slice(0,31)||'Sheet';while(used.has(name))name=name.slice(0,28)+'_'+i;used.add(name);

}

async function syncSheet(btn){

    const fetchWb=async(input)=>{

      for(const x of [res.payload,res.structuredContent,res.content]){const t=findSheetText(x);if(t)return wbFromText(t)}
      const b64=findB64(res.payload)||findB64(res.structuredContent)||findB64(res.content);
      if(b64){const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return wbFromBytes(u8)}

  }catch(e){
    const c=e&&e.code;const msg=c==='server_not_connected'?'Google Drive isn’t connected. Add it in claude.ai Settings → Connectors, or upload the file.':c==='needs_reauth'?'Reconnect Google Drive in claude.ai Settings → Connectors.':c==='not_in_manifest'?'Google Drive access was declined for this page.':c==='tool_error'?('Google Drive refused: '+(e.message||'')):errMsg(e);

function findClosing(wb){
  // TBC style: a label "Closing Balance" with the number next to it. BOG style: a summary table with "საბოლოო ნაშთი ექვ ლარში".
  const out={total:null,parts:[]};
  for(const name of wb.SheetNames){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
    for(let i=0;i<aoa.length;i++){const row=aoa[i];
      const ci=row.findIndex(c=>/საბოლოო ნაშთი ექვ ლარში|closing balance.*gel/i.test(String(c)));
      if(ci>=0){const ai=row.findIndex(c=>/^ანგარიში$|^account$/i.test(String(c).trim()));const vi=row.findIndex(c=>/^ვალუტა|^currency/i.test(String(c).trim()));const oi=row.findIndex(c=>/^საბოლოო ნაშთი$/i.test(String(c).trim()));
        let sum=0,parts=[];for(let j=i+1;j<aoa.length;j++){const r=aoa[j];if(!r.some(c=>c!==''))break;const v=parseNum(r[ci]);if(!v&&!parseNum(r[oi]))continue;const cur=String(r[vi]||'').trim();parts.push({n:('…'+String(r[ai]||'').replace(/[A-Z]{3}$/,'').slice(-4)+' '+cur).trim(),orig:parseNum(r[oi]),cur,v});sum+=v}
        if(parts.length){out.total=Math.round(sum*100)/100;out.parts=parts;return out}}
      const di=row.findIndex(c=>/^ბოლო თარიღი:?$|^filter date to:?$|^პერიოდი:?$/i.test(String(c).trim()));
      if(di>=0){for(let k=di+1;k<row.length;k++){const c=row[k];if(c instanceof Date){const d=new Date(c.getTime()+12*3600e3);out.end=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');break}const mm=String(c).match(/(\d{2})\.(\d{2})\.(\d{4})\s*$/);if(mm){out.end=mm[3]+'-'+mm[2]+'-'+mm[1];break}}}
      const li=row.findIndex(c=>/^საბოლოო ნაშთი:?$|^closing balance:?$/i.test(String(c).trim()));
      if(li>=0){for(let k=li+1;k<row.length;k++){const v=parseNum(row[k]);if(row[k]!==''&&!isNaN(v)&&/[0-9]/.test(String(row[k]))){out.total=v;out.parts=[{n:'GEL',cur:'GEL',orig:v,v}];break}}}
    }
  }
  return out;
}
function bankLoad(wb,fileName,acct){
  const KW={date:/^თარიღი$|^date$|^თარიღ|^date/i,desc:/^დანიშნულება$|ოპერაციის შინაარს|description|details|purpose|narrative/i,partyOut:/მიმღების დასახელება|^პარტნიორი$|partner'?s name|beneficiary|recipient|payee/i,partyIn:/გამგზავნის დასახელება|^პარტნიორი$|partner'?s name|sender|payer/i,
    debit:/დებეტი ექვ ლარში|^დებეტი$|^debit|გასული თანხა|^paid out|withdraw|გასავალ/i,credit:/კრედიტი ექვ ლარში|^კრედიტი$|^credit|შემოსული თანხა|^paid in|deposit/i,amount:/^(თანხა|amount)$/i};
  // pick the sheet + row that look most like a transaction table
  let best={score:-1};
  for(const name of wb.SheetNames){const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''}).filter(r=>r.some(c=>c!==''));
    for(let i=0;i<Math.min(25,aoa.length);i++){const s=aoa[i].filter(c=>typeof c==='string'&&Object.values(KW).some(re=>re.test(c.trim()))).length+(aoa.length-i>3?1:0);if(s>best.score)best={score:s,aoa,hi:i,name}}}
  const aoa=best.aoa||[[]];const hi=best.hi||0;
  const header=aoa[hi].map(c=>String(c).trim());const rows=aoa.slice(hi+1);
  const find=re=>{const exact=header.findIndex(h=>re.test(h)&&/ექვ ლარში/.test(h));return exact>=0?exact:header.findIndex(h=>re.test(h))};
  const map={date:find(KW.date),desc:find(KW.desc),partyOut:header.findIndex(h=>KW.partyOut.test(h)),partyIn:header.findIndex(h=>KW.partyIn.test(h)),debit:find(KW.debit),credit:find(KW.credit),amount:header.findIndex(h=>KW.amount.test(h))};
  if(map.debit>=0||map.credit>=0)map.amount=-1;
  const saved=(S.cfg.bankMaps||{})[acct];if(saved&&saved.sig===header.join('|'))Object.assign(map,saved.map);
  const closing=findClosing(wb);
  S.bank={stage:'map',fileName,acct,header,rows,map,remember:true,closing,saveBal:closing.total!=null};S.animate=true;render();
}
function bankBuild(){
  const B=S.bank,mp=B.map;const rules=[...[...S.rules.values()].map(r=>[r.match,r.cat,r.vendor||'',r.dir||'']),...DEFAULT_RULES];
  const loanE=[...S.loan.values()];
  const existing=new Set([...S.tx.values(),...loanE].map(t=>t.bankKey).filter(Boolean));
  const loanNames=[...new Set(loanE.filter(e=>(e.what||'').length>=4).map(e=>e.what.toLowerCase()))];
  const recs=[...S.tx.values()].filter(t=>t.source==='receipt');
  const onReceipt=(amt,date)=>recs.some(t=>(t.account===B.acct||t.account==='unknown')&&Math.abs((+t.gel||0)-amt)<=Math.max(0.05,amt*0.01)&&Math.abs(new Date(t.date)-new Date(date))<=4*864e5);
  const onLoan=(amt,date)=>loanE.some(e=>e.pot===B.acct&&Math.abs((+e.gel||0)-amt)<0.01&&Math.abs(new Date(e.date)-new Date(date))<=3*864e5);
  const items=[];const posFee={};let lastDate='';
  for(const r of B.rows){
    const p=parseDateCell(r[mp.date]);if(!p||!p.m)continue;const y=p.y||new Date().getFullYear();
    const date=y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0');if(date>lastDate)lastDate=date;
    let out=0,inn=0;if(mp.debit>=0||mp.credit>=0){out=Math.abs(parseNum(mp.debit>=0?r[mp.debit]:0));inn=Math.abs(parseNum(mp.credit>=0?r[mp.credit]:0))}
    else if(mp.amount>=0){const a=parseNum(r[mp.amount]);if(a<0)out=-a;else inn=a}
    if(!out&&!inn)continue;
    const dir=out?'out':'in';const amt=out||inn;
    const desc=String(mp.desc>=0?r[mp.desc]:'').trim();
    const party=String((dir==='out'?(mp.partyOut>=0?r[mp.partyOut]:''):(mp.partyIn>=0?r[mp.partyIn]:''))||'').trim();
    // card-terminal commission is hidden inside each incoming card payment: "საკომისიო: GEL 8.33"
    if(dir==='in'){const fm=desc.match(/საკომისიო:\s*GEL\s*([\d.]+)/i);if(fm&&+fm[1]>0){const k=date.slice(0,7);posFee[k]=posFee[k]||{v:0,n:0};posFee[k].v+=+fm[1];posFee[k].n++}}
    const key=hash(B.acct+'|'+date+'|'+amt.toFixed(2)+'|'+dir+'|'+(party+desc).slice(0,80));
    const near=(party+' '+desc).toLowerCase(),wide=(near+' '+r.filter(c=>typeof c==='string').join(' ')).toLowerCase();const okR=hay=>([m,,,d])=>(!d||d===dir)&&hay.includes(String(m).toLowerCase());const hit=/^საკომისიო|commission/i.test(desc)?['საკომისიო','bank_fees','Bank commission']:(rules.find(okR(near))||rules.find(okR(wide)));
    let cat=hit?hit[1]:'';if(dir==='in'&&(!hit||!['other_income','owner_in','transfer','loan_in'].includes(hit[1])))cat='';
    if(dir==='out'&&['other_income','owner_in'].includes(cat))cat='';
    if(B.acct==='tbc'&&dir==='out'&&(cat==='loan'||loanNames.some(n=>near.includes(n))))cat='toloan';
    const loanDup=!existing.has(key)&&dir==='out'&&onLoan(amt,date);const recDup=!existing.has(key)&&!loanDup&&dir==='out'&&onReceipt(amt,date);const dup=existing.has(key)||loanDup||recDup;
    items.push({date,desc,party,dir,gel:amt,cat,auto:cat,ruleCat:hit?hit[1]:'',loanDup,recDup,rule:hit&&cat?hit[0]:'',vendor:hit&&hit[2]?hit[2]:party.slice(0,60),key,dup,include:!dup&&cat!=='transfer'&&(dir==='out'||cat==='owner_in')});
  }
  for(const [m,f] of Object.entries(posFee)){const v=Math.round(f.v*100)/100;const key=hash(B.acct+'|posfee|'+m+'|'+v.toFixed(2));const dup=existing.has(key);
    items.push({date:m+'-'+String(daysIn(m)).padStart(2,'0'),desc:'Commission taken from '+f.n+' card payments ('+mLabel(m)+')',party:'Card terminal commission',dir:'out',gel:v,cat:'bank_fees',auto:'bank_fees',rule:'card commission',vendor:'Card terminal commission',key,dup,include:!dup,synthetic:true})}
  items.sort((a,b)=>a.date.localeCompare(b.date));
  B.items=items;B.stage='review';B.lastDate=lastDate;
  if(S.db&&S.canWrite){const maps={...(S.cfg.bankMaps||{})};maps[B.acct]={sig:B.header.join('|'),map:B.map};saveCfg({bankMaps:maps}).catch(()=>{})}
  S.animate=true;render();
}

    toast('Saved '+n+' rows from '+ACC[B.acct].en+(B.saveBal&&B.closing.total!=null?' · balance '+gel(B.closing.total,2):''));S.bank=null;go('expenses');
  }catch(e){toast(errMsg(e)+' — saved '+n+' of '+rows.length);btn.disabled=false;btn.textContent='Save'}
}

function plModel(ms){
  const cols=periodCols(ms);const D=cols.map(c=>c.d);
  const used=g=>CATS.filter(c=>c.g===g&&D.some(d=>d.by[c.id]));
  const rows=[];const R=(label,f,cls='',ka='')=>rows.push({label,ka,vals:D.map(f),cls});
  rows.push({sec:'Revenue'});R('Sales (orders)',d=>d.sales,'ind');R('Other income',d=>d.otherInc,'ind');R('Total revenue',d=>d.sales+d.otherInc,'sum');
  rows.push({sec:'Cost of goods'});R('Cost of goods sold',d=>d.cogs,'ind');R('Gross profit',d=>d.gross+d.otherInc,'sum');R('Gross margin %',d=>d.sales?Math.round(d.gross/d.sales*100):0,'pctrow');
  rows.push({sec:'Running costs'});used('opex').forEach(c=>R(c.en,d=>d.by[c.id]||0,'ind',c.ka));R('Total running costs',d=>d.opex,'sum');R('of which fixed (automatic)',d=>d.fixed,'info');R('Operating profit',d=>d.operating,'sum');
  rows.push({sec:'Taxes'});used('tax').forEach(c=>R(c.en,d=>d.by[c.id]||0,'ind',c.ka));R('Net profit',d=>d.net,'sum big');
  rows.push({sec:'Money taken out'});R('Stock bought (added to stock)',d=>d.stockOut,'ind');['loan','owner_draw','personal'].forEach(id=>R(CAT[id].en,d=>d.by[id]||0,'ind',CAT[id].ka));R('Owner money in',d=>d.ownerIn,'ind');R('Cash left in Astroman',d=>d.cash,'sum big');
  rows.push({sec:'Stock paid for (all months)'});used('goods').forEach(c=>R(c.en,d=>d.by[c.id]||0,'ind info',c.ka));
  rows.push({sec:'Orders'});R('Number of orders',d=>d.orders,'ind cnt');R('Average order',d=>d.aov,'ind avg');
  return {ms,cols,D,rows};
}
function statement(A,title,sub){

  const cmp=ms.map(x=>addMonth(x,-12));const open=ms[ms.length-1]<y+'-12';

  const PA=aggregate(R.cmp.map(metrics));const hasCmp=PA.sales>0;

/* ============================== imports ============================== */
// The import flow: several supplier orders (Alibaba, 1688, Bresser…) are paid one by one; the suppliers send them to a
// forwarder's warehouse (China or Germany); the forwarder combines them into one shipment (air, land or sea) that reaches
// Georgia, clears customs and is driven to the store. An order is kept in the 'ships' collection with kind:'order', so it
// rides the existing backend, device cache and backups; every other record there is a shipment.
// Landed cost of a product = its goods + its share of the order's platform fee and delivery to the agent (by value)
// + its share of the shipment's freight, transport and other costs (by weight, value or pieces)
// + its share of customs duty and import VAT (by customs value: goods + fees + freight).

/* ---------- merge: several records from one invoice become one order ---------- */
function mergePlan(ids){
  const recs=ids.map(id=>S.ships.get(id)).filter(Boolean);
  const ords=recs.filter(isOrder),legs=recs.filter(isLegacy);
  const curs=[...new Set([...ords.map(o=>o.cur||'USD'),...(legs.length?['USD']:[])])];
  const cur=curs[0]||'USD';
  const lines=[];let fee=0,dlv=0,wv=0,wfx=0;
  for(const o of ords){const c=orderCalc(o);c.lines.forEach(l=>lines.push({n:l.n,sku:l.sku,q:l.q,p:l.p,w:l.w,from:o.id}));fee+=c.fee;dlv+=c.dlv;if(+o.fx>0&&cur!=='GEL'){wv+=c.total;wfx+=c.total*+o.fx}}
  for(const s of legs){const q=+s.qty||1;lines.push({n:s.item||'Goods',sku:s.sku||'',q,p:+s.usd/q,w:0,from:s.id});wv+=+s.usd;wfx+=+s.usd*(+s.fx||fx())}
  const dates=recs.map(r=>r.date).filter(Boolean).sort();
  const goodsTx=t=>(legs.some(s=>s.txId===t.id)||(legs.some(s=>s.id===t.shipId)&&/^goods/.test(t.cat)&&!t.role));
  const payO=[...S.tx.values()].filter(t=>ords.some(o=>o.id===t.orderId)||goodsTx(t));
  const vendor=(ords.find(o=>o.supplier)||{}).supplier||(payO.find(t=>t.vendor)||{}).vendor||'';
  const realShips=[...new Map(ords.map(shipOf).filter(Boolean).map(s=>[s.id,s])).values()];
  const box=realShips[0]||legs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''))[0]||null;
  const fwds=[...new Set([...realShips,...legs].map(s=>s.forwarder).filter(Boolean))];
  const legCost=legs.reduce((a,s)=>a+(+s.freight||0)*(s.freightCur&&s.freightCur!=='GEL'?(+s.freightFx||lastRate(s.freightCur)||0):1)+(+s.customs||0)+(+s.vat||0)+(+s.local||0)+(+s.other||0),0);
  return {recs,ords,legs,curs,cur,lines,fee,dlv,fx:cur==='GEL'?1:(wv?wfx/wv:lastRate(cur)),date:dates[0]||today(),vendor,ref:(ords.find(o=>o.ref)||{}).ref||'',platform:(ords.find(o=>o.platform)||{}).platform||'',
    payO,box,fwds,legCost,personal:recs.every(r=>r.personal),note:recs.map(r=>r.note).filter(Boolean).join(' · ')}
}

// Order of writes keeps nothing at risk: the new order first, then its payments, then the shipment, and only then
// the old records are removed.
async function doMerge(P,f){
  const oid=uid('o');const legIds=new Set(P.legs.map(s=>s.id));const box=P.box;
  const boxId=box?box.id:'';
  await putShip(oid,{kind:'order',date:f.date,supplier:f.supplier,platform:P.platform||'',ref:f.ref,cur:P.cur,fx:P.cur==='GEL'?1:Math.round(P.fx*10000)/10000,
    lines:P.lines.map(({from,...l})=>l),fee:r2(P.fee),shipFee:r2(P.dlv),shipId:boxId,personal:P.personal,note:P.note,mergedFrom:P.recs.map(r=>r.id)});
  for(const t of P.payO){const nt={...t,orderId:oid};delete nt.shipId;delete nt.role;
    if(P.cur==='USD'&&nt.cur!=='USD'&&legIds.size){const s=P.legs.find(x=>x.txId===t.id||x.id===t.shipId);const exp=s?+s.usd*(+s.fx||fx()):0;
      if(s&&+s.usd>0&&Math.abs(+t.gel-exp)<=exp*0.01){nt.cur='USD';nt.orig=r2(+s.usd);nt.fx=Math.round(t.gel/+s.usd*10000)/10000}}
    await saveTx(nt)}
  for(const t of [...S.tx.values()])if(t.shipId&&legIds.has(t.shipId)&&t.shipId!==boxId&&!P.payO.includes(t))await saveTx({...t,shipId:boxId});
  if(box){const nb={...S.ships.get(box.id)};
    if(isLegacy(nb)){delete nb.item;delete nb.qty;delete nb.usd;delete nb.fx;delete nb.sku;delete nb.txId}
    const others=P.legs.filter(s=>s.id!==box.id);
    if(others.length){const toGel=s=>(+s.freight||0)*(s.freightCur&&s.freightCur!=='GEL'?(+s.freightFx||lastRate(s.freightCur)||0):1);
      const add=others.reduce((a,s)=>a+toGel(s),0);if(add){nb.freight=r2(toGel(nb)+add);nb.freightCur='GEL';nb.freightFx=1}
      ['customs','vat','local','other'].forEach(k=>{const v=others.reduce((a,s)=>a+(+s[k]||0),0);if(v)nb[k]=r2((+nb[k]||0)+v)});
      if(!nb.kg){const kg=others.reduce((a,s)=>a+(+s.kg||0),0);if(kg)nb.kg=kg}}
    await putShip(box.id,nb)}
  for(const o of P.ords)await delDoc('ships/'+o.id);
  for(const s of P.legs)if(s.id!==boxId)await delDoc('ships/'+s.id);
  return oid;
}

/* ---------- imports file: a ready set of shipments and orders, merged with what is already here ---------- */
// The file holds shipments and orders with fixed ids, so loading it twice changes nothing. Records already in the
// app that describe the same goods (an older one-product record, an order, or a shipment of the same forwarder and
// month) are offered for merging: their payments move to the matching new order or shipment, then they are removed.
const tokens=s=>new Set(String(s||'').toLowerCase().replace(/[^a-z0-9Ⴀ-ჿ]+/g,' ').split(' ').filter(w=>w.length>=4&&!/^(telescope|astronomical|order|lamp|light|with|from|goods|the|and|ltd|co|limited|technology|electronic)$/.test(w)));
const overlap=(a,b)=>{let n=0;a.forEach(w=>{if(b.has(w))n++});return n};
const dayDiff=(a,b)=>Math.abs(Date.parse(a||'1970-01-01')-Date.parse(b||'1970-01-01'))/864e5;
function packMatches(P){
  const ids=new Set([...P.ships.map(s=>s.id),...P.orders.map(o=>o.id)]);
  const pOrd=P.orders.map(o=>({o,tk:tokens([o.supplier,o.ref,o.platform,...(o.lines||[]).map(l=>l.n)].join(' ')),tot:(o.lines||[]).reduce((a,l)=>a+(+l.q||0)*(+l.p||0),0)+(+o.fee||0)+(+o.shipFee||0)}));
  const pShip=P.ships.map(s=>({s,fw:String(s.forwarder||'').toLowerCase().replace(/[^a-z]/g,''),d:s.arrivedAt||s.date}));
  const out=[];
  for(const r of S.ships.values()){if(ids.has(r.id))continue;
    if(isOrder(r)||isLegacy(r)){
      const tk=tokens(isOrder(r)?[r.supplier,r.ref,...(r.lines||[]).map(l=>l.n)].join(' '):[r.item,r.note].join(' '));
      const amt=isOrder(r)?orderCalc(r).total:+r.usd;
      let best=null;
      for(const c of pOrd){const dd=dayDiff(r.date,c.o.date);if(dd>75)continue;
        const ov=overlap(tk,c.tk);const sameRef=isOrder(r)&&r.ref&&c.o.ref&&String(r.ref).trim()===String(c.o.ref).trim();
        const amtHit=amt>0&&(Math.abs(amt-c.tot)<=c.tot*0.02||(c.o.lines||[]).some(l=>{const a=(+l.q||0)*(+l.p||0);return a>0&&Math.abs(amt-a)<=a*0.01}));
        const score=(sameRef?10:0)+ov*2+(amtHit?3:0)-dd/30;
        const ok=sameRef||(ov>0&&amtHit)||(ov>=2&&dd<=45)||(ov>0&&dd<=21)||(amtHit&&dd<=30);
        if(ok&&(!best||score>best.score))best={score,to:c.o,why:sameRef?'same order no.':ov&&amtHit?'same goods and amount':ov?'same goods':'same amount'}}
      if(best)out.push({r,kind:isOrder(r)?'order':'older record',to:best.to,toShip:best.to.shipId,why:best.why});
    }else{
      const fw=String(r.forwarder||'').toLowerCase().replace(/[^a-z]/g,'');let best=null;
      for(const c of pShip){if(!fw||!c.fw||(fw!==c.fw&&!fw.includes(c.fw)&&!c.fw.includes(fw)))continue;const dd=Math.min(dayDiff(r.arrivedAt||r.date,c.d),dayDiff(r.date,c.s.date));if(dd>45)continue;if(!best||dd<best.dd)best={dd,to:c.s}}
      if(best)out.push({r,kind:'shipment',toShip:best.to.id,to:null,why:'same forwarder, '+Math.round(best.dd)+' days apart'});
    }}
  return out}
function packModal(P){

  const lineCount=P.orders.reduce((a,o)=>a+(o.lines||[]).length,0);

async function packApply(P,use){
  const now=new Date().toISOString();
  for(const s of P.ships){const {id,...d}=s;await putShip(id,{...d,source:'imports file',updatedAt:now})}
  for(const o of P.orders){const {id,...d}=o;await putShip(id,{kind:'order',...d,source:'imports file',updatedAt:now})}
  const goods=t=>/^goods/.test(t.cat||'')&&!t.role;
  for(const m of use){const r=m.r;
    for(const t of [...S.tx.values()]){
      const mine=t.orderId===r.id||t.shipId===r.id||(r.txId&&t.id===r.txId);if(!mine)continue;const nt={...t};
      if(m.to&&(t.orderId===r.id||r.txId===t.id||goods(t))){nt.orderId=m.to.id;delete nt.shipId;delete nt.role}
      else if(m.toShip){nt.shipId=m.toShip;delete nt.orderId;if(!nt.role)nt.role=/vat/.test(nt.cat)?'vat':'freight'}
      else continue;
      await saveTx(nt)}
    if(m.kind==='shipment')for(const o of orderList())if(o.shipId===r.id&&!use.some(x=>x.r.id===o.id))await putShip(o.id,{...o,shipId:m.toShip});
    await delDoc('ships/'+r.id)}

/* ---------- supplier invoice → one order ---------- */
// A PDF's text is rebuilt into rows from where each word sits on the page; an Excel sheet is read as it is. Then the
// header row (product · qty · price · amount) is found and every position under it becomes one line of the order.
async function pdfRows(file){await loadPdfJs();const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const rows=[];
  for(let i=1;i<=Math.min(pdf.numPages,8);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();
    const its=c.items.filter(x=>x.str&&x.str.trim()).map(x=>({s:x.str,x:x.transform[4],y:x.transform[5],w:x.width||0,h:Math.abs(x.transform[3])||8})).sort((a,b)=>b.y-a.y||a.x-b.x);
    const lines=[];for(const it of its){const ln=lines.find(l=>Math.abs(l.y-it.y)<=Math.max(2,it.h*0.4));if(ln)ln.items.push(it);else lines.push({y:it.y,items:[it]})}
    lines.sort((a,b)=>b.y-a.y);
    for(const ln of lines){ln.items.sort((a,b)=>a.x-b.x);const cells=[];
      for(const it of ln.items){const last=cells[cells.length-1];if(last&&it.x-last.x1<Math.max(3,it.h*0.5)){last.s+=(it.x-last.x1>0.5&&!/\s$/.test(last.s)?' ':'')+it.s;last.x1=Math.max(last.x1,it.x+it.w)}else cells.push({s:it.s,x0:it.x,x1:it.x+it.w})}
      rows.push(cells.map(c=>({s:c.s.trim(),x0:c.x0,x1:c.x1})).filter(c=>c.s))}}
  return rows}
const numOf=v=>{if(typeof v==='number')return v;const m=String(v??'').replace(/[^\d.,\s'-]/g,' ').trim().match(/-?\d[\d\s,.']*/);if(!m)return NaN;const n=normAmt(m[0].trim().replace(/[\s,.']+$/,''));return isNaN(n)?NaN:n};
const isNumCell=v=>typeof v==='number'||/^[^A-Za-zႠ-ჿ]*\d[\d\s,.']*\s*(pcs|pc|sets?|units?|ea|ც|ცალი)?[^A-Za-zႠ-ჿ]*$/i.test(String(v??'').trim());
function hdrKind(t){t=String(t||'').toLowerCase().trim();if(!t||t.length>40)return '';
  if(/amount|total|sum|subtotal|line\s*value|ჯამ|თანხ/.test(t))return 'a';
  if(/price|rate|cost|ფასი/.test(t))return 'p';
  if(/^(qty|q'?ty|quantity|pcs|units?|count|order\s*qty|რაოდ|კოლ)|quantit/.test(t))return 'q';
  if(/^(no\.?|#|n°|№|s\/n|sr\.?|s\.\s*no\.?)$/.test(t))return 'i';
  if(/model|sku|code|art\.?\s*no|part\s*no|item\s*no/.test(t))return 'm';
  if(/descr|product|item|goods|commodity|name|article|specification|დასახ|პროდუქ/.test(t))return 'n';
  if(/^(unit|uom|u\/m)$/.test(t))return 'u';return ''}
// rows: arrays of {s,x0,x1} (PDF) or plain arrays of cells (Excel)
function readInvoice(rows,text){
  const asCells=r=>Array.isArray(r)&&r.length&&typeof r[0]==='object'&&r[0]&&'x0' in r[0]?r:null;
  let hi=-1,cols=null;
  for(let i=0;i<rows.length&&hi<0;i++){const r=rows[i];const cells=asCells(r)?r.map(c=>c.s):r.map(c=>c==null?'':String(c));
    const kinds=cells.map(hdrKind);if(kinds.includes('q')&&(kinds.includes('p')||kinds.includes('a'))&&cells.filter(Boolean).length>=3){hi=i;cols=kinds.map((k,j)=>({k,s:cells[j],x0:asCells(r)?r[j].x0:j,x1:asCells(r)?r[j].x1:j})).filter(c=>c.s)}}
  if(hi<0)return null;
  const pdf=!!asCells(rows[hi]);
  // a header word split over two lines ("Unit" / "Price") — take the kind from the line below when it fills a blank
  if(pdf&&rows[hi+1]&&rows[hi+1].every(c=>hdrKind(c.s)||!isNumCell(c.s))&&rows[hi+1].some(c=>hdrKind(c.s))){rows[hi+1].forEach(c=>{const k=hdrKind(c.s);const col=cols.find(h=>c.x0<h.x1+6&&c.x1>h.x0-6);if(col&&(!col.k||(k&&col.k==='u')))col.k=k||col.k});hi++}
  const idx=k=>cols.findIndex(c=>c.k===k);
  const at=(r,ci)=>{if(ci<0)return '';if(!pdf)return r[cols[ci].x0]??'';
    const h=cols[ci];let best='';r.forEach(c=>{const ov=Math.min(c.x1,h.x1+8)-Math.max(c.x0,h.x0-8);if(ov>0){const own=cols.reduce((b,hh,j)=>{const o2=Math.min(c.x1,hh.x1+8)-Math.max(c.x0,hh.x0-8);return o2>b.o?{o:o2,j}:b},{o:0,j:-1});if(own.j===ci)best+=(best?' ':'')+c.s}});
    if(!best){r.forEach(c=>{const cx=(c.x0+c.x1)/2;const near=cols.reduce((b,hh,j)=>{const d=Math.abs(cx-(hh.x0+hh.x1)/2);return d<b.d?{d,j}:b},{d:1e9,j:-1});if(near.j===ci&&!cols.some(hh=>Math.min(c.x1,hh.x1+8)-Math.max(c.x0,hh.x0-8)>0))best+=(best?' ':'')+c.s})}
    return best};
  const flat=r=>pdf?r.map(c=>c.s):r.map(c=>c==null?'':String(c));
  const qi=idx('q'),pi=idx('p'),ai=idx('a'),mi=idx('m');
  const sample=rows.slice(hi+1,hi+25);const texty=ci=>sample.reduce((a,r)=>{const v=String(at(r,ci)||'').trim();return a+(v&&!isNumCell(v)?v.length:0)},0);
  const nc=cols.map((c,j)=>j).filter(j=>cols[j].k==='n');let ni=nc.length?nc.reduce((b,j)=>texty(j)>texty(b)?j:b,nc[0]):-1;
  if(ni>=0&&!texty(ni)){const alt=cols.map((c,j)=>j).filter(j=>!['q','p','a'].includes(cols[j].k)).sort((x,y)=>texty(y)-texty(x))[0];if(alt!=null&&texty(alt))ni=alt}
  const stopRe=/^(sub\s*-?\s*total|total|grand\s*total|ჯამი|სულ|amount\s*in\s*words|say\s*total)/i;
  const lines=[];let stop=rows.length,lastLine=hi,total=null,grand=null;
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];const cells=flat(r).map(s=>s.trim());if(!cells.some(Boolean))continue;
    if(cells.filter(hdrKind).length>=3)continue;
    const label=cells.find(s=>s&&!isNumCell(s))||'';
    if(stopRe.test(label)){stop=i;break}
    const q=numOf(at(r,qi)),p=numOf(at(r,pi)),a=numOf(at(r,ai));
    let name=String(at(r,ni)||'').trim();const model=String(at(r,mi)||'').trim();
    if(q>0&&(p>0||a>0)){if(!name)name=cells.filter(s=>s&&!isNumCell(s)).sort((x,y)=>y.length-x.length)[0]||'';
      const price=p>0?p:a/q;lines.push({n:name.replace(/\s+/g,' '),model:model&&!name.toLowerCase().includes(model.toLowerCase())?model:'',q,p:Math.round(price*10000)/10000,a:a>0?a:q*price});lastLine=i}
    else if(lines.length&&name&&!(q>0)&&!(a>0)&&!(p>0))lines[lines.length-1].n=(lines[lines.length-1].n+' '+name).replace(/\s+/g,' ').slice(0,140)}
  // fees, shipping and the grand total under the table
  const T=String(text||'');let fee=0,dlv=0,disc=0;
  const tl=rows.slice(Math.min(stop,lastLine+1)).map(r=>flat(r).join('  '));
  // a fee or shipping charge written as a row of the table is not a product
  const FEE=/(transaction|processing|service|platform|handling|payment|bank)\s*(fee|charge)|commission/i,SHIP=/^(shipping|freight|delivery|express|courier|logistics)(\s*(fee|cost|charge))?\b/i;
  for(let k=lines.length-1;k>=0;k--){const l=lines[k];if(FEE.test(l.n)){fee+=l.a;lines.splice(k,1)}else if(SHIP.test(l.n.trim())){dlv+=l.a;lines.splice(k,1)}}
  const lastNum=s=>{const m=s.match(/-?\d[\d\s,.']*\d|\d/g);return m?numOf(m[m.length-1]):NaN};
  for(const s of tl){const v=lastNum(s);if(!(Math.abs(v)>0))continue;const t=s.toLowerCase();
    if(/(transaction|processing|service|platform|handling|payment|bank)\s*(fee|charge)|commission/.test(t)&&!/%\s*$/.test(t.trim()))fee+=Math.abs(v);
    else if(/(shipping|freight|delivery|express|courier|logistics)\s*(fee|cost|charge|amount)?/.test(t)&&!/address|method|mark|term|time|date|port|by\s|via/.test(t))dlv+=Math.abs(v);

  const cnt=k=>(T.match(k)||[]).length;const cs={USD:cnt(/USD|US\$|\$/g),EUR:cnt(/EUR|€/g),CNY:cnt(/CNY|RMB|¥/g)};
  const cur=Object.entries(cs).sort((a,b)=>b[1]-a[1])[0];
  const refM=T.match(/(?:invoice|order|proforma(?:\s*invoice)?|\bPI|contract)\s*(?:no\.?|number|#|id)\s*[:.：]?\s*([A-Z0-9][A-Z0-9\-\/_.]{2,30})/i);
  const supM=T.match(/(?:seller|supplier|exporter|vendor|beneficiary|sold\s*by|company\s*name)\s*(?:name)?\s*[:：]\s*([^\n]{3,80})/i);

  lines.forEach(l=>{l.n=((l.n||'')+(l.model?(l.n?' · ':'')+l.model:'')).replace(/\s+/g,' ').trim().slice(0,140);delete l.model});
  return {lines,fee:fee-disc>0?r2(fee-disc):r2(fee),disc:r2(disc),dlv:r2(dlv),total,cur:cur&&cur[1]?cur[0]:'',ref:refM?refM[1]:'',date:parseReceipt(T).date||'',supplier}
}
async function readInvoiceFile(f){
  if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){const rows=await pdfRows(f);const text=rows.map(r=>r.map(c=>c.s).join('  ')).join('\n');return readInvoice(rows,text)}
  if(/\.(xlsx|xls|csv)$/i.test(f.name)){await xlsxReady();const wb=wbFromBytes(new Uint8Array(await f.arrayBuffer()));let best=null;
    for(const n of wb.SheetNames){const aoa=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});const text=aoa.map(r=>r.join('  ')).join('\n');const r=readInvoice(aoa,text);if(r&&(!best||r.lines.length>best.lines.length))best=r}
    return best}
  throw {message:'Use the invoice as a PDF or an Excel file'}}

  {const d=$('#invDrop');d.onclick=()=>$('#invFile').click();d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#invFile').click()}});

function bindUnlink(after){document.querySelectorAll('#modalRoot [data-unlink],#main [data-unlink]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const t=S.tx.get(b.dataset.unlink);if(!t)return;

// what a freight/customs/VAT payment does to the shipment's cost: with nothing entered yet it becomes the cost;
// with a cost already typed in, it is kept unless you choose to replace it or add a second invoice on top
function costChoice(s,role){const has=+s[role]>0;const lbl=costLabel(role).toLowerCase();const now=role==='freight'&&s.freightCur&&s.freightCur!=='GEL'?money(s.freight,s.freightCur):gel(s[role]||0,2);
  return has?`<option value="keep">Keep the ${esc(lbl)} as entered (${now})</option><option value="replace">Replace it with this payment</option><option value="add">Add it on top (another invoice)</option>`
    :`<option value="set">Use it as the shipment's ${esc(lbl)}</option><option value="keep">Don't change the shipment's costs</option>`}
async function applyCost(id,role,mode,p){if(!mode||mode==='keep')return;const cs=S.ships.get(id);if(!cs)return;const nb={...cs};
  if(role==='freight'){const fc=cs.freightCur||'GEL',old=+cs.freight||0,oldFx=fc==='GEL'?1:(+cs.freightFx||lastRate(fc)||0);
    if(mode!=='add'||!old){if(p.cur!=='GEL'&&p.amt){nb.freight=r2(p.amt);nb.freightCur=p.cur;nb.freightFx=Math.round(p.gel/p.amt*10000)/10000}else{nb.freight=r2(p.gel);nb.freightCur='GEL';nb.freightFx=1}}
    else if(fc===p.cur&&fc!=='GEL'){nb.freight=r2(old+p.amt);nb.freightFx=Math.round((old*oldFx+p.gel)/(old+p.amt)*10000)/10000}
    else{nb.freight=r2(old*oldFx+p.gel);nb.freightCur='GEL';nb.freightFx=1}}
  else nb[role]=r2((mode==='add'?(+cs[role]||0):0)+p.gel);
  await putShip(id,nb)}

function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve();return loadPdfJs.p||(loadPdfJs.p=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  sc.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}res()};sc.onerror=()=>{loadPdfJs.p=null;rej({message:'Could not load the PDF reader'})};document.head.appendChild(sc)}))}
async function pdfText(file){await loadPdfJs();const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let t='';
  for(let i=1;i<=Math.min(pdf.numPages,4);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n'}return t}
function normAmt(s){s=String(s).replace(/[\s' ]/g,'');const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>ld)s=s.length-lc-1<=2?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else s=s.replace(/,/g,'');return parseFloat(s)}
// Reads date, amount, currency and bank from the text of a payment receipt. It only suggests: every field stays editable.
function parseReceipt(txt){
  const T=String(txt||'').replace(/\s+/g,' ');const out={};
  let m=T.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);if(m)out.date=m[1]+'-'+m[2]+'-'+m[3];
  if(!out.date){m=T.match(/\b(\d{1,2})[./](\d{1,2})[./](20\d{2})\b/);if(m)out.date=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  if(!out.date){const mo='(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*';m=T.match(new RegExp('\\b(\\d{1,2}) '+mo+',? (20\\d{2})','i'))||T.match(new RegExp('\\b'+mo+' (\\d{1,2}),? (20\\d{2})','i'));
    if(m){const a=isNaN(+m[1]);const mon=EN_MONTHS.findIndex(x=>x.slice(0,3).toLowerCase()===(a?m[1]:m[2]).slice(0,3).toLowerCase())+1;const d=a?m[2]:m[1];if(mon)out.date=m[3]+'-'+String(mon).padStart(2,'0')+'-'+String(d).padStart(2,'0')}}
  const CUR={USD:'USD','US$':'USD',$:'USD',EUR:'EUR','€':'EUR',GEL:'GEL','₾':'GEL',CNY:'CNY',RMB:'CNY','¥':'CNY'};
  const num='(\\d{1,3}(?:[ ,. ]\\d{3})*(?:[.,]\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)';
  const re=new RegExp('(US\\$|USD|EUR|GEL|CNY|RMB|[$€₾¥])\\s?'+num+'|'+num+'\\s?(USD|EUR|GEL|CNY|RMB|[$€₾¥])','g');
  const cands=[];let x,prev=0;while((x=re.exec(T))){const c=CUR[x[1]||x[4]];const v=normAmt(x[2]||x[3]);const before=T.slice(Math.max(prev,x.index-45),x.index).toLowerCase();prev=x.index+x[0].length;if(!c||!(v>0))continue;
    let score=/amount|total|sum|paid|თანხა|სულ|ჯამი|გადახდ|ჩამოწერ/.test(before)?3:0;if(/fee|commission|საკომისიო|tax/.test(before))score-=4;if(/equivalent|ექვივალ|ლარში/.test(before))score-=1;
    cands.push({c,v,score,eq:/equivalent|ექვივალ|ლარში/.test(before)})}
  if(cands.length){const foreign=cands.filter(k=>k.c!=='GEL');const pool=(foreign.length?foreign:cands).slice().sort((a,b)=>b.score-a.score||b.v-a.v);const best=pool[0];out.cur=best.c;out.amt=best.v;
    if(best.c!=='GEL'){const g=cands.filter(k=>k.c==='GEL'&&k.score>-3).sort((a,b)=>(b.eq-a.eq)||(b.v-a.v))[0];if(g&&g.v>best.v)out.gel=g.v}}
  const rm=T.match(/(?:rate|კურსი)\s*:?\s*(\d+[.,]\d{2,6})/i);if(rm&&!out.gel&&out.amt&&out.cur!=='GEL')out.gel=r2(out.amt*normAmt(rm[1]));
  if(/bank of georgia|საქართველოს ბანკ|\bbog\b/i.test(T))out.acct='bog';else if(/\btbc\b|თიბისი/i.test(T))out.acct='tbc';
  return out}

// moving a shipment along: each step records its day once; stepping back clears the later days
async function setShipStatus(id,st){const s=S.ships.get(id);if(!s)return;const b={...s,status:st};const i=stIdx(st);
  if(i>=1&&!b.shippedAt)b.shippedAt=today();if(i>=2&&!b.customsAt)b.customsAt=today();if(i>=3&&!b.arrivedAt)b.arrivedAt=today();
  if(i<3)b.arrivedAt='';if(i<2)b.customsAt='';if(i<1)b.shippedAt='';
  await putShip(id,b);toast(stLabel(st)+(i>=1?' · '+shortD(i===3?b.arrivedAt:i===2?b.customsAt:b.shippedAt):''))}
async function impAct(a,b){const I=impState();
  if(a==='newOrder')return orderModal(null,b&&b.dataset.ship?{shipId:b.dataset.ship}:null);
  if(a==='newShip')return shipModal();
  if(a==='invOrder')return orderModal(null,{pickInvoice:true});
  if(a==='impPack')return packPick();
  if(a==='impMerge'){const ids=[...I.sel].filter(id=>S.ships.get(id));return mergeModal(ids)}
  if(a==='impTab'){I.tab=b.dataset.v;I.q='';S.animate=true;return render()}
  if(a==='impView'){impView(b.dataset.k);I.view[b.dataset.k]=b.dataset.v;lsSet('af.impView',JSON.stringify(I.view));S.animate=true;return render()}
  if(a==='impSt'){I.st=b.dataset.v;return render()}
  if(a==='impOf'){I.of=b.dataset.v;return render()}
  if(a==='impStage'){const v=b.dataset.v;if(v==='pay'||v==='wait'){I.tab='orders';I.of=v==='wait'?'loose':'pay'}else{I.tab='ships';I.st=v==='way'?'active':'done';I.y=v==='done'?String(new Date().getFullYear()):''}I.q='';I.fw='';S.animate=true;return render()}
  if(a==='impClear'){I.sel.clear();return render()}
  if(a==='impPut'){const ids=[...I.sel].filter(id=>S.ships.get(id));if(ids.length)putModal(ids);return}
  if(a==='impBack'){I.ship=null;S.animate=true;render();window.scrollTo({top:0});return}
  if(a==='impVat'){await saveCfg({impVat:vatInCost()?'reclaim':'cost'});S.mc=new Map();return render()}
  if(a==='shipEdit')return shipModal(I.ship);
  if(a==='shipAddOrders')return addOrdersModal(I.ship);
  if(a==='payShip')return payModal({shipId:I.ship});
  if(a==='linkShip')return linkModal({shipId:I.ship});
  if(a==='shipSt')return setShipStatus(I.ship,b.dataset.v);
  if(a==='shipBasis'){const s=S.ships.get(I.ship);if(s)await putShip(I.ship,{...s,basis:b.dataset.v});return}
  return false}

/* ============================== loan ============================== */
// The bank loan has its own ledger (collection `loan`), never mixed into the shop's books:
// the money received, every payment made with it and repayments to the bank.
// Entry {date, kind:'in'|'spend'|'repay', pot:'tbc'|'cash', gel, what, purpose, part, note, bankKey}
// Cash in hand is a number Rezi types (cfg.loan.cash {gel,date}); it is shown on its own and never changes the loan numbers.
const POTS={tbc:'TBC',cash:'Cash'};
const LOAN_USE=[{id:'dev',en:'Developers',ka:'დეველოპერები'},{id:'software',en:'AI tools & software',ka:'პროგრამები'},{id:'goods',en:'Goods & stock',ka:'საქონელი'},{id:'bank',en:'Bank fees',ka:'საკომისიო'},{id:'other',en:'Other',ka:'სხვა'}];
const LUSE=Object.fromEntries(LOAN_USE.map(u=>[u.id,u]));
const LKIND={spend:'Payment',repay:'Repayment',in:'Loan received'};
const loanLabel=()=>S.cfg.loan?.label||'Loan';
// old app versions saved cash counts as kind 'move'; they are not loan spending and are ignored everywhere
const loanEntries=()=>[...S.loan.values()].filter(e=>e.kind!=='move');
function loanPotDelta(e,pot){const v=+e.gel||0;if(e.pot!==pot||e.kind==='move')return 0;return e.kind==='in'?v:-v}
// Developers are kept on their own. Everything else is "other expenses" together.
// Rezi types what is left of the loan (cfg.loan.left); other expenses = received − developers − left,
// so spending he never itemised still shows up. Without a typed amount, left comes from the entries.
function loanInfo(){
  if(S.mc.has('#loan'))return S.mc.get('#loan');
  let r=null;
  if(loanEntries().length){r={received:0,dev:0,otherRec:0,interest:0,principal:0,fromPot:{tbc:0,cash:0},by:{},devBy:{},devMonth:{},otherMonth:{},start:''};
    for(const e of loanEntries()){const v=+e.gel||0;
      if(e.kind==='in'){r.received+=v;if(!r.start||e.date<r.start)r.start=e.date;continue}
      r.fromPot[e.pot==='cash'?'cash':'tbc']+=v;const m=(e.date||'').slice(0,7);
      if(e.kind==='spend'&&e.purpose==='dev'){r.dev+=v;const n=(e.what||'Developer').trim();r.devBy[n]=(r.devBy[n]||0)+v;r.devMonth[m]=(r.devMonth[m]||0)+v;continue}
      r.otherRec+=v;r.otherMonth[m]=(r.otherMonth[m]||0)+v;
      if(e.kind==='repay'){if(e.part==='interest')r.interest+=v;else r.principal+=v}
      else{const u=LUSE[e.purpose]?e.purpose:'other';r.by[u]=(r.by[u]||0)+v}}
    r.repaid=r.interest+r.principal;r.owed=r.received-r.principal;
    r.leftCalc=r.received-r.dev-r.otherRec;const T=S.cfg.loan?.left;r.typed=T&&T.gel!=null?T:null;
    r.left=r.typed?+r.typed.gel:r.leftCalc;r.other=r.received-r.dev-r.left;r.unitemised=r.other-r.otherRec;r.out=r.dev+r.other;
    // where the left is: the TBC balance is a bank fact; loan money not on TBC any more was taken off it
    const tb=liveBalances().tbc;r.tbcNow=tb?tb.now:null;r.tbcAsOf=tb?tb.asOf:'';
    r.onTbc=tb?Math.max(0,Math.min(r.left,tb.now)):r.left;r.offTbc=r.left-r.onTbc}
  S.mc.set('#loan',r);return r;
}
// loan money spent in some months, developers apart from the rest (for Expenses and Profit & loss)
function loanSpentIn(ms){const inM=new Set(ms);let dev=0,other=0;for(const e of loanEntries()){if(e.kind==='in'||!inM.has((e.date||'').slice(0,7)))continue;const v=+e.gel||0;if(e.kind==='spend'&&e.purpose==='dev')dev+=v;else other+=v}return {dev,other}}

function loanModal(id,kind){

// Kept apart from the books: Optimo exports live in their own collection and never change the P&L.
// Stock doc  optimo/stock          {kind:'stock',at,file,items:[[barcode,name,category,qty,min,cost,price,vat]]}
// Sales doc  optimo/sales-<from>_<to> {kind:'sales',from,to,file,at,rows:[[barcode,name,qty,cost,revenue,vat]]}
const OP_STATUS={reorder:['bad','Reorder'],soon:['warn','Order soon'],optional:['','Out · slow seller'],negative:['bad','Count is wrong'],dead:['warn','Never sold'],slow:['warn','Too much stock'],ok:['good','OK'],gone:['','Not in stock list']};
function opDocs(){const out={stock:null,sales:[]};S.optimo.forEach((d,id)=>{if(d.kind==='stock')out.stock=d;else if(d.kind==='sales')out.sales.push({...d,id})});out.sales.sort((a,b)=>String(b.to).localeCompare(String(a.to))||spanDays(b)-spanDays(a));return out}
const spanDays=d=>Math.max(1,Math.round((Date.parse(d.to)-Date.parse(d.from))/864e5)+1);
const dLabel=s=>{const [y,m,d]=s.split('-');return +d+' '+EN_MONTHS[+m-1].slice(0,3)+' '+y};
function opSettings(){const c=S.cfg.optimo||{};return {cover:+c.cover||3,lead:+c.lead||1}}
function opModel(){
  if(S.mc.has('#op'))return S.mc.get('#op');
  const D=opDocs();if(!D.stock&&!D.sales.length){S.mc.set('#op',null);return null}
  const sel=D.sales.find(x=>x.id===S.op.period)||D.sales[0]||null;
  // the sales rate behind reorder advice comes from the shortest recent export (≥ 30 days), else the selected one
  const stockDay=D.stock?D.stock.at.slice(0,10):today();
  const recent=D.sales.filter(x=>spanDays(x)>=30&&Math.abs(Date.parse(stockDay)-Date.parse(x.to))<=21*864e5).sort((a,b)=>spanDays(a)-spanDays(b));
  const rateDoc=recent[0]||sel;const rateMonths=rateDoc?spanDays(rateDoc)/30.44:1;
  const map=new Map();const get=(b,n)=>{let it=map.get(b);if(!it)map.set(b,it={b,n,cat:'',q:null,min:0,cost:0,price:0,vat:'',sq:0,rev:0,sc:0,sv:0,rq:0});if(n&&!it.n)it.n=n;return it};
  (D.stock?.items||[]).forEach(([b,n,cat,q,min,cost,price,vat])=>{const it=get(b,n);it.n=n;Object.assign(it,{cat,q,min,cost,price,vat})});
  (sel?.rows||[]).forEach(([b,n,q,cost,rev,vat])=>{const it=get(b,n);it.sq+=q;it.rev+=rev;it.sc+=cost;it.sv+=vat});
  if(rateDoc)rateDoc.rows.forEach(([b,n,q])=>{get(b,n).rq+=q});
  const {cover,lead}=opSettings();
  const items=[...map.values()].map(it=>{
    const profit=it.rev-it.sc-it.sv;const rate=it.rq/rateMonths;const inStock=it.q!=null;const q=it.q??0;
    const netPrice=it.vat==='ჩვეულებრივი'?it.price/1.18:it.price;const unit=netPrice-it.cost;
    let status='ok',order=0;const cov=rate>0?Math.max(q,0)/rate:null;
    if(!inStock)status='gone';
    else if(q<0)status='negative';
    else if(q<=0&&rate>0&&rate<1/3)status='optional';
    else if(rate>0&&(q<=0||q<it.min||cov<lead))status='reorder';
    else if(rate>0&&cov<lead+1)status='soon';
    else if(q>0&&it.rq===0&&it.sq===0)status='dead';
    else if(cov!=null&&cov>12)status='slow';
    if(['reorder','soon','negative','optional'].includes(status)&&rate>0)order=Math.max(Math.ceil(rate*cover)-Math.max(q,0),it.min-Math.max(q,0),1);
    return {...it,q,inStock,profit,margin:it.rev?profit/it.rev:null,rate,cov,unit,markup:it.cost?unit/it.cost:null,value:Math.max(q,0)*it.cost,retail:Math.max(q,0)*netPrice,status,order,orderCost:order*it.cost};
  });
  const sum=(arr,k)=>arr.reduce((a,x)=>a+(x[k]||0),0);
  const stocked=items.filter(x=>x.inStock);
  const cats=new Map();items.forEach(x=>{const k=x.inStock?(x.cat||'Other'):'Not in stock list';const c=cats.get(k)||cats.set(k,{n:k,rev:0,profit:0,sq:0,value:0,items:0,reorder:0}).get(k);c.rev+=x.rev;c.profit+=x.profit;c.sq+=x.sq;c.value+=x.value;c.items++;if(x.status==='reorder')c.reorder++});
  const M={D,sel,rateDoc,rateMonths,items,stocked,cats:[...cats.values()].sort((a,b)=>b.rev-a.rev),
    rev:sum(items,'rev'),profit:sum(items,'profit'),sq:sum(items,'sq'),cost:sum(items,'sc'),vat:sum(items,'sv'),
    value:sum(stocked,'value'),retail:sum(stocked,'retail'),units:stocked.reduce((a,x)=>a+Math.max(x.q,0),0),
    reorder:items.filter(x=>x.status==='reorder'),soon:items.filter(x=>x.status==='soon'),optional:items.filter(x=>x.status==='optional'),negative:items.filter(x=>x.status==='negative'),
    dead:items.filter(x=>x.status==='dead'),slow:items.filter(x=>x.status==='slow')};
  M.orderCost=sum(M.reorder,'orderCost');M.deadValue=sum(M.dead,'value')+M.slow.reduce((a,x)=>a+Math.max(0,x.q-Math.ceil(x.rate*12))*x.cost,0);
  S.mc.set('#op',M);return M;
}

const rateTxt=r=>r>=0.95?fmt(r,r<10?1:0)+' a month':r>0?'1 every '+Math.max(2,Math.round(1/r))+' months':'no sales';

/* ---------- reading Optimo exports ---------- */
function opParse(wb,file){
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}).filter(r=>r.some(c=>c!==''));
  const hi=aoa.findIndex(r=>r.some(c=>/ბარკოდი|barcode/i.test(String(c))));if(hi<0)throw {message:file.name+': no barcode column (ბარკოდი) found'};
  const h=aoa[hi].map(c=>String(c).trim());const col=re=>h.findIndex(x=>re.test(x));const body=aoa.slice(hi+1);
  const B=col(/ბარკოდი|barcode/i),N=col(/დასახელება|name/i),Q=col(/^რაოდენობა$|quantity/i),V=col(/დღგ-ს ტიპი/);
  const num=v=>typeof v==='number'?v:parseNum(String(v).replace('%',''));
  if(col(/მინიმალური მარაგი/)>=0){
    const MIN=col(/მინიმალური მარაგი/),C=col(/^შესყიდვის ფასი$/),P=col(/^გასაყიდი ფასი$/),K=col(/კატეგორია/);
    const items=body.filter(r=>String(r[B]).trim()).map(r=>[String(r[B]).trim(),String(r[N]).trim(),String(r[K]||'').trim(),num(r[Q]),num(r[MIN]),num(r[C]),num(r[P]),String(r[V]||'').trim()]);
    const d=new Date(file.lastModified||Date.now());
    return {kind:'stock',file:file.name,at:d.toISOString(),items};
  }
  const SC=col(/შესყიდვის ჯამი/),R=col(/ჯამური თანხა/),T=col(/ჯამური დღგ/);
  if(SC<0||R<0)throw {message:file.name+' is not an Optimo sale history or stock list'};
  const rows=body.filter(r=>String(r[B]).trim()&&num(r[Q])).map(r=>[String(r[B]).trim(),String(r[N]).trim(),num(r[Q]),num(r[SC]),num(r[R]),T>=0?num(r[T]):0]);
  const m=file.name.match(/(\d{2})-(\d{2})-(\d{4})[^-]*-\s*(\d{2})-(\d{2})-(\d{4})/);
  const from=m?`${m[3]}-${m[2]}-${m[1]}`:'',to=m?`${m[6]}-${m[5]}-${m[4]}`:today();
  return {kind:'sales',file:file.name,at:new Date().toISOString(),from,to,rows};
}
// a sale history inside one year, in the shape the profit calculation reads (cost of items sold vs sales)
function yearDoc(d){const rows=d.rows.map(([b,n,q,k,r])=>({n,c:b,q,r,k,p:Math.round((r-k)*100)/100}));
  return {from:d.from.slice(0,7),to:d.to.slice(0,7),rows,hasCost:true,revenue:Math.round(rows.reduce((a,x)=>a+x.r,0)*100)/100,cost:Math.round(rows.reduce((a,x)=>a+x.k,0)*100)/100,qty:rows.reduce((a,x)=>a+x.q,0),source:'Optimo sale history · '+d.file,uploadedAt:new Date().toISOString()}}
function opUpload(files){
  const out=[];let left=files.length;const errs=[];
  [...files].forEach(f=>{const r=new FileReader();r.onload=async()=>{try{await xlsxReady();out.push(opParse(wbFromBytes(new Uint8Array(r.result)),f))}catch(e){errs.push(e.message||'Could not read '+f.name)}if(--left===0)opPreview(out,errs)};r.readAsArrayBuffer(f)});
}
function opPreview(docs,errs){
  if(!docs.length){toast(errs[0]||'Nothing to import');return}
  modal(`<h3>Add to Optimo</h3>${errs.map(e=>`<p class="small" style="color:var(--bad)">${esc(e)}</p>`).join('')}
   <div class="flow mt">${docs.map((d,i)=>d.kind==='stock'?`<div class="ln"><span class="k"><b>Stock list</b> · ${d.items.length} items<div class="muted small">${esc(d.file)} · replaces the current stock list</div></span><span class="v num">${gel(d.items.reduce((a,x)=>a+Math.max(0,x[3])*x[5],0))}</span></div>`
     :`<div class="ln"><span class="k"><b>Sale history</b> · ${d.rows.length} lines<div class="muted small">${esc(d.file)}</div><div class="row small" style="gap:6px;margin-top:6px">from <input type="date" class="input" style="width:auto" data-opf="${i}" value="${d.from}"> to <input type="date" class="input" style="width:auto" data-opt="${i}" value="${d.to}"></div></span><span class="v num">${gel(d.rows.reduce((a,x)=>a+x[4],0))}</span></div>`).join('')}</div>
   <p class="hint mt">A sale history for the same dates replaces the earlier one. One that stays inside one year also sets that year's real cost of goods in the profit figures.</p>
   <div class="foot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="opSave">Save</button></div>`,true);
  $('#opSave').onclick=async()=>{
    for(const [i,d] of docs.entries()){if(d.kind!=='sales')continue;d.from=document.querySelector(`[data-opf="${i}"]`).value;d.to=document.querySelector(`[data-opt="${i}"]`).value;if(!d.from||!d.to||d.from>d.to){toast('Set the dates of the sale history');return}}
    for(const d of docs){const id=d.kind==='stock'?'stock':'sales-'+d.from+'_'+d.to;await S.db.doc('optimo/'+id).set(d);if(d.kind==='sales'){S.op.period=id;if(d.from.slice(0,4)===d.to.slice(0,4))await S.db.doc('itemsYear/'+d.from.slice(0,4)).set(yearDoc(d))}}
    closeModal();toast('Optimo data saved');const stock=docs.find(d=>d.kind==='stock');if(stock){try{await storeSyncOptimo(stock)}catch(e){toast(errMsg(e))}}S.op.tab='overview';S.animate=true;render()};
}
