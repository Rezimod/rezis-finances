<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1533">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Astroman Finance">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='8.5' fill='%23F5A623'/%3E%3Cellipse cx='17' cy='17' rx='15' ry='5' fill='none' stroke='%231C3480' stroke-width='2' transform='rotate(-22 17 17)'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px)}</style>

<body>
<title>Astroman Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: observatory logbook — night-sky rail + a starfield hero over a light working sheet; on phones a top month dial and a bottom tab bar with a central + button. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#ECF0F8; --ink:#101A31; --ink-2:#46516E; --muted:#6F7A96; --line:#DAE0EC;
  --brand:#1C3480; --brand-ink:#FFFFFF; --accent:#F5A623; --accent-ink:#1A1300;
  --night:#0B1533; --night-2:#16245A; --night-ink:#E4EAFB; --night-muted:#93A1CB;
  --good:#1D8051; --warn:#A86A12; --bad:#C0392F; --good-bg:#E2F3E9; --warn-bg:#FBF0DC; --bad-bg:#FBE5E2;
  --s1:#2F5BD3; --s2:#C27A06; --grid:#E5E9F2; --shadow:0 1px 2px rgba(16,26,49,.04);
  --f-ui:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090F1F; --surface:#111A2E; --surface-2:#18233C; --ink:#E6EBF7; --ink-2:#AAB4CC; --muted:#7B86A2; --line:#24304D;
  --brand:#8EAEFF; --brand-ink:#0A1020; --night:#060B1A; --night-2:#101C45;
  --good:#4CC38A; --warn:#E2B04A; --bad:#F0776C; --good-bg:#12301F; --warn-bg:#33270F; --bad-bg:#3A1714;
  --s1:#6B8FF0; --s2:#B87A10; --grid:#1D2842; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090F1F; --surface:#111A2E; --surface-2:#18233C; --ink:#E6EBF7; --ink-2:#AAB4CC; --muted:#7B86A2; --line:#24304D;
  --brand:#8EAEFF; --brand-ink:#0A1020; --night:#060B1A; --night-2:#101C45;
  --good:#4CC38A; --warn:#E2B04A; --bad:#F0776C; --good-bg:#12301F; --warn-bg:#33270F; --bad-bg:#3A1714;
  --s1:#6B8FF0; --s2:#B87A10; --grid:#1D2842; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* ---------- rail ---------- */
.rail{background:linear-gradient(180deg,var(--night) 0%,var(--night-2) 140%);color:var(--night-ink);padding-block:20px;padding-inline:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding-inline:6px}
.brand svg{flex:none}
.brand .ring{transform-origin:17px 17px;animation:tilt 9s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(8deg)}}
.brand b{display:block;font-weight:700;font-size:15px;letter-spacing:.01em}
.brand small{display:block;color:var(--night-muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.monthdial{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 10px}
.monthdial label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--night-muted)}
.monthdial .row{display:flex;align-items:center;gap:6px;margin-top:4px}
.monthdial select{flex:1;background:transparent;border:0;color:var(--night-ink);font-weight:600;font-size:15px;padding:2px 0;min-width:0;cursor:pointer}
.monthdial select option{color:#111;background:#fff}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--night-ink);border-radius:7px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s}
.iconbtn:hover{background:rgba(255,255,255,.1)}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu button{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:var(--night-ink);padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;font-size:14px;opacity:.78;transition:background .15s,opacity .15s,transform .15s}
nav.menu button:hover{background:rgba(255,255,255,.07);opacity:1;transform:translateX(2px)}
nav.menu button[aria-current="page"]{background:rgba(245,166,35,.16);color:#FFD58A;opacity:1}
nav.menu .sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
nav.menu .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--night-muted);padding:2px 10px 4px}
.rail .foot{margin-top:auto;font-size:11.5px;color:var(--night-muted);padding-inline:6px;display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4CC38A;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 0 rgba(76,195,138,.6);animation:pulse 2.4s infinite}
.dot.off{background:#E2B04A;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 6px rgba(76,195,138,0)}100%{box-shadow:0 0 0 0 rgba(76,195,138,0)}}
.addbtn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .15s}
.syncbtn{background:rgba(255,255,255,.08);color:var(--night-ink);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer;margin-top:-8px}
.syncbtn:hover{background:rgba(255,255,255,.14)}.syncbtn:disabled{opacity:.6}
@media (max-width:860px){.syncbtn{display:none}}
.addbtn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(245,166,35,.35)}
/* ---------- main ---------- */
main{padding-block:24px 80px;padding-inline:clamp(16px,3vw,40px);min-width:0}
main:focus{outline:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.pagehead p{margin:4px 0 0;color:var(--ink-2);max-width:64ch}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:500;white-space:nowrap;transition:border-color .15s,transform .12s,box-shadow .15s,background .15s}
.btn:hover{border-color:var(--brand);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.amber{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.amber:hover{box-shadow:0 6px 18px rgba(245,166,35,.3)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.panel h2{margin:0 0 3px;font-size:15px;font-weight:700}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.mt{margin-top:16px}
@media (max-width:1100px){.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.g2{grid-template-columns:minmax(0,1fr)}}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 140% at 85% -10%,#2A3F95 0%,var(--night-2) 38%,var(--night) 75%);color:var(--night-ink);padding:22px 22px 18px;margin-bottom:16px;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.hero .eyebrow{color:var(--night-muted)}
.hero h1{margin:2px 0 0;font-size:26px;font-weight:700;letter-spacing:-.015em}
.hero .hnote{margin-top:12px;font-size:12.5px;color:var(--night-muted);border-top:1px solid rgba(255,255,255,.1);padding-top:10px}.hero .hnote b{color:var(--night-ink);font-weight:600}
.hero .lead{color:var(--night-muted);margin:4px 0 0;font-size:13px;max-width:56ch}
.hero .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:var(--night-ink)}
.hero .btn:hover{border-color:var(--accent)}
.hero .btn.amber{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:20px;background:rgba(255,255,255,.1);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.hkpi{background:rgba(9,15,40,.55);backdrop-filter:blur(4px);padding:14px 16px;min-width:0}
.hkpi .lbl{font-size:12px;color:var(--night-muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hkpi .val{font-size:27px;font-weight:600;margin-top:2px;line-height:1.15;color:#fff}
.hkpi .val small{font-size:15px;color:var(--night-muted);font-weight:500;margin-left:3px}
.hkpi .delta{font-size:12px;margin-top:3px;color:var(--night-muted)}
.hkpi .up{color:#6EE0A6}.hkpi .down{color:#FF9389}
.money{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1250px){.money{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.mcard::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c,var(--brand))}
.mcard .lbl{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mcard .val{font-size:23px;font-weight:600;margin-top:2px}
.mcard .val small{font-size:14px;color:var(--muted);margin-left:2px}
.mcard .parts{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.55}
.mcard .bar2{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.mcard .bar2 i{display:block;height:100%;background:var(--accent);transform-origin:left}
@media (max-width:1000px){.money{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.money{grid-template-columns:minmax(0,1fr)}}
.tag{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:999px;background:rgba(245,166,35,.18);color:#FFD58A;font-weight:600}
@media (max-width:900px){.hkpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- kpi strip (light) ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.kpi{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .lbl{font-size:12px;color:var(--ink-2)}
.kpi .val{font-size:25px;font-weight:600;margin-top:3px;line-height:1.15}
.kpi .val small{font-size:15px;color:var(--muted);font-weight:500;margin-left:2px}
.kpi .delta{font-size:12px;margin-top:3px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)} .neg{color:var(--bad)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
/* ---------- flow ---------- */
.flow{display:flex;flex-direction:column}
.flow .ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.flow .ln:last-child{border-bottom:0}
.flow .ln .k{color:var(--ink-2)}
.flow .ln.total{border-bottom:1px solid var(--line);border-top:1px solid var(--ink);margin-top:4px;padding-top:9px}
.flow .ln.total .k{color:var(--ink);font-weight:700}
.flow .ln.total .v{font-weight:600}
.flow .ln.minor .k{padding-left:14px;font-size:13px}
.flow .ln.minor .v{color:var(--ink-2);font-size:13px}
.flow .group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:14px;padding-bottom:2px;font-weight:600}
/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;border-radius:6px}
.bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar .name span{color:var(--muted);font-size:11.5px;margin-left:4px}
.bar .track{height:10px;background:var(--surface-2);border-radius:0 4px 4px 0;overflow:hidden}
.bar .fill{height:100%;border-radius:0 4px 4px 0;min-width:2px;transform-origin:left center}
.bar .amt{text-align:right;min-width:92px}
.bar .amt small{display:block;font-size:11px;color:var(--muted)}
.bar.click{cursor:pointer}.bar.click:hover .name{color:var(--ink)}
@media (max-width:520px){.bar{grid-template-columns:minmax(0,1fr) auto}.bar .track{grid-column:1/-1;grid-row:2}}
/* ---------- chips, alerts ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.goods{border-color:color-mix(in srgb,var(--s2) 45%,transparent)}
.chip.tax{border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.chip.below{border-style:dashed;border-color:var(--muted)}
.chip.fixed{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;background:var(--surface-2);font-size:13px}
.alert .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.alert.warn .ic{background:var(--warn-bg);color:var(--warn)}
.alert.bad .ic{background:var(--bad-bg);color:var(--bad)}
.alert.good .ic{background:var(--good-bg);color:var(--good)}
.alert.info .ic{background:var(--surface);color:var(--brand)}
.alert b{font-weight:600}
/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0;white-space:nowrap}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--ink)}
th.sorted{color:var(--brand)}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tr.click{cursor:pointer}
tr.virtual td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.pl td,.pl th{white-space:nowrap}
.pl td:first-child,.pl th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px}
.pl tr.sec td{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:16px}
.pl tr.sum td{font-weight:700;border-top:1px solid var(--ink)}
.pl tr.sum.big td,.pl tr.sum.big td:first-child{font-size:14px;background:var(--surface-2)}
.pl td.cur{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.pl tr.ind td:first-child{padding-left:26px;color:var(--ink-2)}
.pl tr.info td{color:var(--muted);font-size:12.5px}
.odot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:2px}
/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;color:var(--ink-2);font-weight:500}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bigamount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.bigamount input{border:0;background:transparent;font-family:var(--f-num);font-size:42px;font-weight:600;width:100%;min-width:0;padding:0}
.bigamount input:focus{outline:none}
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 14px}
.pbar .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.pbar .seg::-webkit-scrollbar{display:none}
.pbar .seg button{white-space:nowrap}
.pbar .pyear{width:auto;min-width:96px;flex:none;padding-top:7px;padding-bottom:7px}
.hm{}
@media (max-width:640px){.hm{display:none}}
.pcustom{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.pcustom .input{width:auto;padding-top:7px;padding-bottom:7px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;transition:background .15s}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.catbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0;transition:border-color .15s,transform .12s,background .15s}
.catbtn b{font-weight:600;font-size:13px}
.catbtn small{color:var(--muted);font-size:11.5px}
.catbtn:hover{border-color:var(--brand);transform:translateY(-1px)}
.catbtn[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,var(--surface));box-shadow:inset 0 0 0 1px var(--accent)}
.catgroup{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto}

/* recon meter */
.meter{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}

/* modal, toast, tip */
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.55);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .18s ease both}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .22s var(--ease) both}
.modal.wide{width:min(920px,100%)}
.modal h3{margin:0 0 4px;font-size:18px}

@keyframes rise{from{opacity:0;transform:translateY(12px)}}@keyframes growx{from{transform:scaleX(0)}}@keyframes growy{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}

.chart svg{display:block;width:100%;height:auto;overflow:visible}
.scrollx{overflow-x:auto;scrollbar-width:thin;margin-inline:-4px;padding-inline:4px}

}

// old order sheets (2021–2023) carry a cost per order line
function rowCostRatio(rows,sales){if(!sales)return null;let a=0,k=0;for(const r of rows){if(r.k!=null&&r.k!==''&&!isNaN(+r.k)){a+=+r.a||0;k+=+r.k}}return a>=sales*.9&&a>0?k/a:null}

function metrics(m){
  const hit=S.mc.get(m);if(hit)return hit;
  const s=S.sales.get(m);const rows=s?.rows||[];
  const sales=rows.reduce((a,r)=>a+(+r.a||0),0);
  const list=txOf(m);const by={};for(const t of list){by[t.cat]=(by[t.cat]||0)+(+t.gel||0)}
  const sum=g=>CATS.filter(c=>c.g===g).reduce((a,c)=>a+(by[c.id]||0),0);
  const stock=sum('goods'),opex=sum('opex'),tax=sum('tax'),below=sum('below'),otherInc=by.other_income||0,ownerIn=by.owner_in||0;
  let ratio=null,src=null;const O=optimoOf(m);
  if(O){ratio=O.cost/O.revenue;src='optimo'}else{const Y=yearOptimoFor(m);if(Y){ratio=Y.cost/Y.revenue;src='year'}else{const rc=rowCostRatio(rows,sales);if(rc!=null){ratio=rc;src='sheet'}}}
  const accurate=(S.cfg.method||'auto')!=='cash'&&ratio!=null;if(!accurate)src=null;
  const cogs=accurate?sales*ratio:stock;
  const gross=sales-cogs;const operating=gross+otherInc-opex;const net=operating-tax;
  const stockOut=accurate?stock:0;const cash=net-below-stockOut+ownerIn;
  const fixed=list.filter(t=>t.virtual).reduce((a,t)=>a+t.gel,0);
  const M={m,sales,orders:rows.length,aov:rows.length?sales/rows.length:0,by,stock,cogs,accurate,allAccurate:accurate,srcs:src?[src]:[],ratio,src,opex,tax,below,stockOut,otherInc,ownerIn,gross,operating,net,cash,fixed,hasSales:!!s,rows,list};
  S.mc.set(m,M);return M;
}

  if(R.p==='month')return [cur];
  if(R.p==='ytd')return monthsBetween(cur.slice(0,4)+'-01',cur);

  if(R.p==='custom'){let a=R.from||firstMonth(),b=R.to||now;if(a>b)[a,b]=[b,a];return monthsBetween(a,b)}

function readCreds(){
  const h=location.hash||'';const m=h.match(/connect=([A-Za-z0-9+/=_-]+)/);
  if(m){try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));if(o.u&&o.k){lsSet('af.backend',JSON.stringify({u:o.u,k:o.k}));try{history.replaceState(null,'',location.pathname)}catch(e){}}}catch(e){}}
  try{const c=JSON.parse(lsGet('af.backend')||'null');return c&&c.u&&c.k?c:null}catch(e){return null}
}
function phoneLink(){const c=readCreds();if(!c)return '';const b=btoa(unescape(encodeURIComponent(JSON.stringify({u:c.u,k:c.k})))).replace(/\+/g,'-').replace(/\//g,'_');return location.origin+location.pathname+'#connect='+b}
async function gasCall(u,k,body){
  let r;try{r=await fetch(u,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,key:k})})}catch(e){throw {message:'Could not reach Google — check the internet connection'}}
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){throw {message:'The backend did not answer correctly. Check the web-app URL and that access is set to “Anyone”.'}}
  if(j.error==='bad_key')throw {code:'bad_key',message:'Wrong secret key'};if(j.error)throw {message:j.error};return j;
}
// Google rejects big requests unpredictably, so every save goes out in requests of at most ~28 KB;
// a record bigger than that is sent in pieces that the backend puts back together.
const REQ_BYTES=28000,PIECE=7000;const utf8=s=>new TextEncoder().encode(s).length;
function packOps(ops){
  const flat=[];for(const op of ops){if(op.op!=='set'){flat.push(op);continue}const json=JSON.stringify(op.d);
    if(utf8(json)<=REQ_BYTES-600){flat.push(op);continue}
    const n=Math.ceil(json.length/PIECE);for(let i=0;i<n;i++)flat.push({op:'part',c:op.c,id:String(op.id),i,n,s:json.slice(i*PIECE,(i+1)*PIECE)})}
  const reqs=[];let cur=[],size=0;for(const op of flat){const b=utf8(JSON.stringify(op))+20;if(cur.length&&(size+b>REQ_BYTES||cur.length>=40)){reqs.push(cur);cur=[];size=0}cur.push(op);size+=b}if(cur.length)reqs.push(cur);return reqs}
async function writeOps(u,k,ops,onStep){
  const reqs=packOps(ops);let done=0;const total=ops.length;const count=r=>r.filter(o=>o.op!=='part'||o.i===o.n-1).length;
  for(const r of reqs){let err;for(let attempt=0;attempt<5;attempt++){try{const j=await gasCall(u,k,{action:'write',ops:r});if(j&&j.error)throw {message:j.error};err=null;break}catch(e){err=e;if(e.code==='bad_key')break;await new Promise(z=>setTimeout(z,2000*(attempt+1)))}}
    if(err)throw {code:err.code,message:'Stopped after '+done+' of '+total+' records ('+(err.message||'Google did not answer')+'). Import the same file again — it continues where it stopped.'};
    done+=count(r);if(onStep)onStep(Math.min(done,total),total)}}
// Every change goes into an outbox kept on this device until Google confirms it, so nothing is lost
// if the page closes, the phone goes offline or Google fails. A copy of all records is cached on the
// device so the app opens instantly; afterwards only records changed since the last visit are fetched.
const OUTBOX='af.outbox',CACHE='af.cache';
function backendDB(u,k){
  const cols=new Map();const L=[];let loaded=false,busy=false,timer=0,since=0,fails=0,delta=true;
  let outbox=[];try{outbox=JSON.parse(lsGet(OUTBOX)||'[]')}catch(e){}
  let seq=outbox.reduce((m,o)=>Math.max(m,o.q||0),0);
  const col=c=>cols.get(c)||(cols.set(c,new Map()),cols.get(c));
  const fire=l=>{if(l.kind==='c')l.cb({docs:[...col(l.path)].map(([id,d])=>({id,exists:true,data:()=>d})),size:col(l.path).size,empty:!col(l.path).size});else{const [c,id]=l.path.split('/');const d=col(c).get(id);l.cb({id,exists:!!d,data:()=>d})}};
  const emit=()=>L.forEach(fire);
  const saveOutbox=()=>{try{localStorage.setItem(OUTBOX,JSON.stringify(outbox))}catch(e){toast('This device is out of storage space. Keep the page open until it says “Saved to Google”.')}};
  let cacheT=0;const saveCache=()=>{clearTimeout(cacheT);cacheT=setTimeout(()=>{const docs=[];cols.forEach((m,c)=>m.forEach((d,id)=>docs.push([c,id,d])));try{localStorage.setItem(CACHE,JSON.stringify({u,at:since,docs}))}catch(e){try{localStorage.removeItem(CACHE)}catch(e2){}}},800)};
  const apply=op=>{if(op.op==='delete')col(op.c).delete(op.id);else col(op.c).set(op.id,op.d)};
  const docId=x=>{let id=String(x.id);if((x.c==='sales'||x.c==='items')&&x.d&&/^\d{4}-\d{2}$/.test(x.d.month||''))id=x.d.month;return id};
  function status(){
    if(!loaded)return;
    if(outbox.length)setConn(fails<2,fails?outbox.length+' change'+(outbox.length>1?'s':'')+' waiting — retrying':'Saving…');
    else setConn(true,'Saved to Google');
  }
  async function flush(){
    if(busy||!outbox.length)return;busy=true;status();
    const batch=outbox.slice(0,60);
    try{await writeOps(u,k,batch.map(({q,...op})=>op));
      const done=new Set(batch.map(o=>o.q));outbox=outbox.filter(o=>!done.has(o.q));saveOutbox();fails=0;busy=false;status();
      if(outbox.length)flush();}
    catch(e){busy=false;fails++;status();
      if(e.code==='bad_key'){toast('The secret key was changed. Connect again — your unsaved changes are kept on this device.');return}
      clearTimeout(timer);timer=setTimeout(flush,Math.min(60000,5000*fails))}
  }
  function push(op){
    op.q=++seq;const key=op.c+'/'+op.id;
    // an older unsent change to the same record is replaced by this one (unless it is being sent right now)
    if(!busy)outbox=outbox.filter(o=>o.c+'/'+o.id!==key);
    outbox.push(op);saveOutbox();apply(op);emit();saveCache();status();
    clearTimeout(timer);timer=setTimeout(flush,300);
  }
  function fromCache(){
    let c;try{c=JSON.parse(lsGet(CACHE)||'null')}catch(e){}
    if(!c||c.u!==u||!Array.isArray(c.docs))return false;
    c.docs.forEach(([cc,id,d])=>col(cc).set(id,d));outbox.forEach(apply);since=c.at||0;loaded=true;emit();setConn(true,'Updating…');return true;
  }
  // A quick check only adds or updates records, it never removes any: a read that lands while Google is
  // rewriting a row can miss that row. Removals (an expense deleted on another device) arrive with the
  // full reload, done on every open and every 30 minutes; a full reload that comes back much smaller
  // than what we have is treated as a bad read and ignored.
  let lastFull=0;
  async function load(full){
    if(!full&&Date.now()-lastFull>30*60000)full=true;
    let r=null,changed=!loaded;
    if(delta&&since&&!full){try{r=await gasCall(u,k,{action:'since',t:since-300000})}catch(e){if(e.code==='bad_key')throw e;if(/unknown action/.test(e.message||''))delta=false;else throw e}}
    if(r&&Array.isArray(r.docs)){
      r.docs.forEach(x=>{const id=docId(x),m=col(x.c);if(JSON.stringify(m.get(id))!==JSON.stringify(x.d)){m.set(id,x.d);changed=true}});
    }else{
      r=await gasCall(u,k,{action:'all'});if(!Array.isArray(r.docs))throw {message:'Google sent an incomplete answer'};
      let have=0;cols.forEach(m=>have+=m.size);
      if(have>20&&r.docs.length<have*.8){lastFull=Date.now()-25*60000;throw {message:'Google sent an incomplete answer — keeping your data'}}
      cols.clear();r.docs.forEach(x=>col(x.c).set(docId(x),x.d));changed=true;lastFull=Date.now();
    }
    outbox.forEach(apply);since=r.at||Date.now();loaded=true;saveCache();
    if(changed)emit();status();return r;
  }
  const api={
    collection:path=>({onSnapshot(cb,err){const l={kind:'c',path,cb,err};L.push(l);if(loaded)fire(l);return()=>{}}}),
    doc:path=>{const [c,id]=path.split('/');return {
      set:async d=>push({op:'set',c,id,d:JSON.parse(JSON.stringify(d))}),
      update:async d=>push({op:'set',c,id,d:{...(col(c).get(id)||{}),...JSON.parse(JSON.stringify(d))}}),
      delete:async()=>push({op:'delete',c,id}),
      get:async()=>{const d=col(c).get(id);return {id,exists:!!d,data:()=>d}},
      onSnapshot(cb){const l={kind:'d',path,cb};L.push(l);if(loaded)fire(l);return()=>{}}}},
    load,fromCache,flush,pending:()=>outbox.length||busy,
    orders:sheetId=>gasCall(u,k,{action:'orders',sheetId}),
    importAll:async(docs,onStep)=>{busy=true;try{await writeOps(u,k,docs.map(x=>({op:'set',c:x.c,id:String(x.id),d:x.d})),onStep)}finally{busy=false}await load(true)},
  };
  // keep fresh: pick up changes when the app comes back to the foreground, and every 2 minutes while open
  const refresh=()=>{if(document.hidden)return;flush();if(!busy)load().then(autoSyncSales).catch(()=>{})};
  document.addEventListener('visibilitychange',refresh);setInterval(refresh,120000);
  addEventListener('online',()=>{fails=0;flush()});
  addEventListener('beforeunload',e=>{if(outbox.length){e.preventDefault();e.returnValue=''}});
  return api;
}
// New orders in the order sheet flow in by themselves: whenever the app is open it re-reads the sheet
// (at most every 15 minutes) and updates the months that changed. A month whose total went down is
// left for you to check with “Sync from Google Sheet”.
async function autoSyncSales(){
  if(!S.backend||!S.canWrite||autoSyncSales.busy)return;
  if(Date.now()-(+lsGet('af.salesAt')||0)<15*60000)return;
  autoSyncSales.busy=true;
  try{
    await xlsxReady();
    const r=await S.backend.orders(sheetId());const P=parseOrdersWorkbook(wbFromSheets(r.sheets),'Google Sheet (auto)');
    const ch=P.months.filter(m=>m.pick&&(m.oldTotal==null||Math.abs(m.total-m.oldTotal)>=0.01||m.count!==m.oldCount));
    for(const m of ch)await S.db.doc('sales/'+m.m).set(salesDoc(m,P.source));
    lsSet('af.salesAt',String(Date.now()));
    if(ch.length)toast('Sales updated from the order sheet: '+ch.map(m=>mShort(m.m)+' '+gel(m.total)).join(', '));
  }catch(e){}finally{autoSyncSales.busy=false}
}
function xlsxReady(){return window.XLSX?Promise.resolve():new Promise(r=>addEventListener('load',r,{once:true}))}
const sheetId=()=>S.cfg.sheetId||'1MXZq3Li7W6hfoDGVo9KMYPodS7haezf6TG1CwFmCtdk';
function wbFromSheets(sheets){const wb=XLSX.utils.book_new();const used=new Set();(sheets||[]).forEach(x=>{let n=String(x.name).slice(0,31)||'Sheet';while(used.has(n))n=n.slice(0,28)+'_'+used.size;used.add(n);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(x.values||[[]]),n)});return wb}
// a month uploaded from a file is locked: syncing from the Google Sheet never replaces it
const salesDoc=(m,source,locked)=>({month:m.m,rows:m.rows,source,syncedAt:new Date().toISOString(),count:m.count,total:Math.round(m.total*100)/100,...(locked?{locked:true}:{})});

  const sub=(path,key)=>S.db.collection(path).onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()}));S[key]=m;S.loaded[key]=true;schedule()});
  sub('tx','tx');sub('sales','sales');sub('ships','ships');sub('rules','rules');sub('items','items');sub('itemsYear','itemsYear');sub('optimo','optimo');
  S.db.doc('cfg/main').onSnapshot(d=>{S.cfg=d.exists?{...d.data()}:{};S.loaded.cfg=true;$('#fxTxt').textContent='1 USD = '+fx().toFixed(2)+' ₾';schedule()});

}

/* ============================== starfield ============================== */
let starRAF=0;
function starfield(cv){
  cancelAnimationFrame(starRAF);if(!cv)return;const ctx=cv.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);
  const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const stars=Array.from({length:Math.round(W*H/2600)},()=>({x:rnd()*W,y:rnd()*H,r:rnd()*1.2+.25,p:rnd()*6.28,s:.4+rnd()*1.4}));
  const draw=t=>{ctx.clearRect(0,0,W,H);for(const s of stars){const a=.35+.45*Math.sin(s.p+t*.0012*s.s);ctx.globalAlpha=Math.max(.08,a);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()}
    ctx.globalAlpha=1;};
  if(reduced()){draw(0);return}
  const loop=t=>{if(!document.body.contains(cv))return;if(!document.hidden)draw(t);starRAF=requestAnimationFrame(loop)};starRAF=requestAnimationFrame(loop);
}

function vOverview(){
  const m=S.month,M=metrics(m),P=metrics(addMonth(m,-1));
  const has=M.hasSales||M.list.length;
  const d=(a,b,inv,lbl)=>{if(!b)return '';const ch=Math.round((a-b)/Math.abs(b)*100);const good=inv?ch<=0:ch>=0;return `<span class="${good?'up':'down'}">${ch>=0?'▲':'▼'} ${Math.abs(ch)}%</span> vs ${lbl||mShort(addMonth(m,-1))}`};
  // the current month is compared with the same days of last month, not the whole of it

function dailyChart(M){
  const days=daysIn(M.m);const v=Array(days).fill(0);
  M.rows.forEach(r=>{if(r.d&&r.d.startsWith(M.m)){v[+r.d.slice(8)-1]+=r.a}});
  const W=640,H=210,pl=40,pb=24,pt=10,iw=W-pl-8,ih=H-pt-pb;const max=Math.max(1100,...v);const step=max>3000?1000:500;const top=Math.ceil(max/step)*step;
  const sy=x=>pt+ih-(x/top)*ih;const bw=iw/days;let g='';for(let t=0;t<=top;t+=step)g+=`<line x1="${pl}" x2="${W-8}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--grid)"/><text x="${pl-6}" y="${sy(t)+4}" text-anchor="end">${t>=1000?fmt(t/1000,1)+'k':t}</text>`;
  g+=`<line x1="${pl}" x2="${W-8}" y1="${sy(1000)}" y2="${sy(1000)}" stroke="var(--accent)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  let b='';v.forEach((x,i)=>{const h=ih*(x/top);const w=Math.max(2,bw-3);const X=pl+i*bw+1.5;if(h>0.5){const r=Math.min(3,h,w/2);b+=`<path class="gy" d="M${X},${pt+ih} v${-(h-r)} q0,${-r} ${r},${-r} h${w-2*r} q${r},0 ${r},${r} v${h-r} z" fill="${x>=1000?'var(--s2)':'var(--s1)'}"/>`}
    if((i+1)%5===0||i===0)b+=`<text x="${X+w/2}" y="${H-6}" text-anchor="middle">${i+1}</text>`;
    b+=`<rect class="dhit hitbar" data-d="${i+1}" data-v="${x}" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent"/>`});
  return `<div class="legend"><span><i style="background:var(--s1)"></i>Below target</span><span><i style="background:var(--s2)"></i>1,000 ₾ or more</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales per day" id="dailySvg">${g}${b}</svg>`;
}

/* ---------- order sheet parsing ---------- */
function normPay(s){s=String(s||'').trim().toLowerCase();if(!s||s==='აირჩიე')return 'unknown';
  const map=[['ტერმინ','pos'],['terminal','pos'],['საქართველოს ბანკ','bog'],['bog','bog'],['თბს','tbc'],['tbc','tbc'],['wolt','wolt'],['ვოლტ','wolt'],['გლოვო','glovo'],['glovo','glovo'],['ნაღდ','cash'],['cash','cash'],['პირად','personal'],['ექსტრ','extra'],['extra','extra'],['ადგილზე','cod'],['ჩასარიცხ','pending'],['ნაწილ','installment'],['განვად','installment']];
  for(const [k,v] of map)if(s.includes(k))return v;return 'other'}
function tabYear(name){const y=(name.match(/20\d\d/)||[])[0];return y?+y:null}
function tabYM(name,defY){let m=0;KA_MONTHS.forEach((k,i)=>{if(name.includes(k))m=i+1});const y=(name.match(/20\d\d/)||[])[0];return m?{y:y?+y:defY,m}:null}
function parseDateCell(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600e3);return {y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()}}
  if(typeof v==='number'){if(v>30000&&v<80000){const d=new Date(Math.round((v-25569)*864e5)+12*3600e3);return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()}}
    if(v>=1&&v<32&&!Number.isInteger(+v.toFixed(4))){const dd=Math.floor(v);let mm=Math.round((v-dd)*100);if(mm<1||mm>12)return null;return {y:null,m:mm,d:dd}}return null}
  const s=String(v||'').trim();const mt=s.match(/^(\d{1,2})[./](\d{1,2})\.?(?:[./](\d{2,4}))?\.?$/);
  if(mt){const dd=+mt[1],mm=+mt[2];if(dd<1||dd>31||mm<1||mm>12)return null;let y=mt[3]?+mt[3]:null;if(y&&y<100)y+=2000;return {y,m:mm,d:dd}}
  const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return {y:+iso[1],m:+iso[2],d:+iso[3]};return null;
}
function parseOrdersWorkbook(wb,source,file){
  const defY=new Date().getFullYear();const out={};const tabs=[];
  for(const name of wb.SheetNames){
    if(/იმპორტ|import|report/i.test(name))continue;   // shipment and report tabs are not orders
    const ws=wb.Sheets[name];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});if(!aoa.length)continue;
    if(/income statement|შემოსავლები/i.test(aoa.slice(0,8).flat().join(' ')))continue;   // monthly income-statement tabs
    const tym=tabYM(name,defY);
    let hi=-1;for(let i=0;i<Math.min(8,aoa.length);i++){if(aoa[i].some(c=>/თანხა|amount|price|ფასი/i.test(String(c)))){hi=i;break}}
    const hdr=hi>=0?aoa[hi].map(c=>String(c).toLowerCase()):[];
    const body=aoa.slice(hi+1);const ncol=Math.min(20,Math.max(...aoa.slice(0,60).map(r=>r.length)));
    const score=(f)=>{const s=Array(ncol).fill(0);body.slice(0,400).forEach(r=>{for(let c=0;c<ncol;c++)if(f(r[c],c))s[c]++});return s};
    const best=(s,ex=[])=>{let bi=-1,bv=0;s.forEach((v,i)=>{if(!ex.includes(i)&&v>bv){bv=v;bi=i}});return bi};
    const hdrIdx=re=>hdr.findIndex(h=>re.test(h));
    let amtCol=hdrIdx(/თანხა|amount|price|ფასი/);
    const dateS=score(v=>{const p=parseDateCell(v);return !!(p&&p.m)});
    const payS=score(v=>{const p=normPay(v);return p!=='unknown'&&p!=='other'});
    if(amtCol<0){const numS=score(v=>{const n=typeof v==='number'?v:parseNum(v);return n>=5&&n<100000});amtCol=best(numS,[best(dateS)])}
    const dateCol=best(dateS,[amtCol]);const payCol=hdrIdx(/გადახდ|payment/)>=0?hdrIdx(/გადახდ|payment/):best(payS,[amtCol,dateCol]);
    let custCol=hdrIdx(/დამკვეთ|customer|client/),prodCol=hdrIdx(/პროდუქტ|product|item|დასახელ/);
    if(custCol<0){custCol=best(score(v=>/ფილიალი|wolt|ვოლტი|filiali|საიტი/i.test(String(v))),[amtCol,dateCol,payCol])}
    if(prodCol<0&&custCol>=0)prodCol=custCol+1;
    let stCol=-1;hdr.forEach((h,i)=>{if(/სტატუს|status/.test(h))stCol=i});if(stCol<0)stCol=best(score(v=>/დასრულ|მიმდინარ|გამზად/.test(String(v))));
    if(amtCol<0)continue;if(hi<0&&!tym)continue;if(!tym&&dateCol<0)continue;
    const tY=tabYear(name);let n=0,skipped=0,cancelled=0;
    for(const r of body){
      const raw=r[amtCol];const a=typeof raw==='number'?raw:parseNum(raw);if(!a||a<=0)continue;
      const st=stCol>=0?String(r[stCol]||''):'';if(/გაუქმ|cancel/i.test(st)){cancelled++;continue}
      const p=dateCol>=0?parseDateCell(r[dateCol]):null;
      let y=p?.y||tY||defY,m=p?.m||tym?.m,d=p?.d||null;if(!m){skipped++;continue}
      if(tym&&p&&!p.y&&p.m===12&&tym.m===1)y=y-1;

function findSheetText(x,d=0){if(d>6||x==null)return null;if(typeof x==='string')return x.includes('## Sheet name:')?x:null;if(typeof x==='object'){for(const k of Object.keys(x)){const r=findSheetText(x[k],d+1);if(r)return r}}return null}

function wbFromText(text){

}

function findClosing(wb){

function bankLoad(wb,fileName,acct){

function bankBuild(){

    const near=(party+' '+desc).toLowerCase(),wide=(near+' '+r.filter(c=>typeof c==='string').join(' ')).toLowerCase();const okR=hay=>([m,,,d])=>(!d||d===dir)&&hay.includes(String(m).toLowerCase());const hit=/^საკომისიო|commission/i.test(desc)?['საკომისიო','bank_fees','Bank commission']:(rules.find(okR(near))||rules.find(okR(wide)));

  }

    items.push({date:m+'-'+String(daysIn(m)).padStart(2,'0'),desc:'Commission taken from '+f.n+' card payments ('+mLabel(m)+')',party:'Card terminal commission',dir:'out',gel:v,cat:'bank_fees',auto:'bank_fees',rule:'card commission',vendor:'Card terminal commission',key,dup,include:!dup,synthetic:true})}
  items.sort((a,b)=>a.date.localeCompare(b.date));

function plModel(ms){
  const cols=periodCols(ms);const D=cols.map(c=>c.d);
  const used=g=>CATS.filter(c=>c.g===g&&D.some(d=>d.by[c.id]));
  const rows=[];const R=(label,f,cls='',ka='')=>rows.push({label,ka,vals:D.map(f),cls});
  rows.push({sec:'Revenue'});R('Sales (orders)',d=>d.sales,'ind');R('Other income',d=>d.otherInc,'ind');R('Total revenue',d=>d.sales+d.otherInc,'sum');
  rows.push({sec:'Cost of goods'});R('Cost of goods sold',d=>d.cogs,'ind');R('Gross profit',d=>d.gross+d.otherInc,'sum');R('Gross margin %',d=>d.sales?Math.round(d.gross/d.sales*100):0,'pctrow');
  rows.push({sec:'Running costs'});used('opex').forEach(c=>R(c.en,d=>d.by[c.id]||0,'ind',c.ka));R('Total running costs',d=>d.opex,'sum');R('of which fixed (automatic)',d=>d.fixed,'info');R('Operating profit',d=>d.operating,'sum');
  rows.push({sec:'Taxes'});used('tax').forEach(c=>R(c.en,d=>d.by[c.id]||0,'ind',c.ka));R('Net profit',d=>d.net,'sum big');
  rows.push({sec:'Money taken out'});R('Stock bought (months with item costs)',d=>d.stockOut,'ind');['loan','owner_draw','personal'].forEach(id=>R(CAT[id].en,d=>d.by[id]||0,'ind',CAT[id].ka));R('Owner money in',d=>d.ownerIn,'ind');R('Cash left in Astroman',d=>d.cash,'sum big');
  if(S.cfg.loan){rows.push({sec:'Loan (kept separate, not in profit)'});R('Paid from the loan',d=>d.by.loan_spend||0,'ind info')}
  rows.push({sec:'Stock paid for (all months)'});used('goods').forEach(c=>R(c.en,d=>d.by[c.id]||0,'ind info',c.ka));
  rows.push({sec:'Orders'});R('Number of orders',d=>d.orders,'ind cnt');R('Average order',d=>d.aov,'ind avg');
  return {ms,cols,D,rows};
}
function statement(A,title,sub){

  const cats=g=>CATS.filter(c=>c.g===g).map(c=>[esc(c.en)+' <small>'+esc(c.ka)+'</small>',A.by[c.id]||0]).sort((a,b)=>b[1]-a[1]);

  const rev=A.sales+A.otherInc;
  return `<div class="panel stmt"><h2>${title}</h2><p class="sub">${sub}</p>
   ${L('Revenue',gel(rev),'',det([['Sales ('+fmt(A.orders)+' orders)',A.sales],['Other income',A.otherInc]]))}
   ${L('Cost of goods sold',z(A.cogs),'',A.allAccurate?`<div class="sdl"><span>Real cost of the items sold (${[...new Set(A.srcs||[])].map(x=>COGS_SRC[x]).join(', ')})</span><span class="num">${pct(A.cogs,A.sales)}% of sales</span></div>`:det(cats('goods'))+(A.accurate?'<div class="sdl muted">Months with item costs (Optimo, or cost per order in old sheets) use the real cost of items sold; other months count stock when it was paid for.</div>':''))}
   ${L('Gross profit',gel(A.gross+A.otherInc),'tot',`<div class="sdl"><span>Margin</span><span class="num">${pct(A.gross,A.sales)}%</span></div>`)}
   ${L('Running costs',z(A.opex),'',det(cats('opex')))}
   ${L('Taxes',z(A.tax),'',det(cats('tax')))}
   ${L('Net profit',gel(A.net),'tot big '+(A.net<0?'neg':''),null)}
   <div class="sgap"></div>
   ${L('Taken out of the business',z(A.below+A.stockOut),'',det([['Stock bought (imports, freight)',A.stockOut],...['loan','owner_draw','personal'].map(id=>[CAT[id].en,A.by[id]||0]),['Money you put in',-A.ownerIn]]))}
   ${L('Cash left in Astroman',gel(A.cash),'tot '+(A.cash<0?'neg':''),null)}
   ${A.firstM&&A.firstM<'2026-09'?'<p class="hint" style="margin:8px 0 0">Before September 2026 the books don’t record money you put in yourself (for example your own dollars used for imports), so “cash left” is only a rough guide for those months. Profit figures are not affected.</p>':''}
   ${A.by.loan_spend?L('Paid from the loan (separate)',gel(A.by.loan_spend),'muted',null):''}
  </div>`;
}
function netChart(ms){
  const cols=periodCols(ms);const D=cols.map(c=>Object.assign({},c.d,{m:c.key,lbl:c.label}));
  const W=Math.max(300,D.length*44),H=220,pl=8,pr=8,pt=26,pb=28,iw=W-pl-pr,ih=H-pt-pb;const mx=Math.max(1000,...D.map(d=>Math.abs(d.net)));const neg=D.some(d=>d.net<0);
  const zero=neg?pt+ih*mx/(2*mx):pt+ih;const sc=v=>Math.abs(v)/mx*(neg?ih/2:ih);
  const gw=iw/D.length,bw=Math.min(34,gw-10);let g=`<line x1="${pl}" x2="${W-pr}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>`;
  D.forEach((d,i)=>{const x=pl+gw*i+(gw-bw)/2,h=Math.max(1,sc(d.net)),cur=d.m===S.month;const y=d.net>=0?zero-h:zero;
    g+=`<rect class="gy" x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${d.net<0?'var(--bad)':'var(--s1)'}" opacity="${cur?1:.75}"/>`;
    g+=`<text x="${x+bw/2}" y="${d.net>=0?y-6:y+h+13}" text-anchor="middle" style="fill:var(--ink-2);font-weight:${cur?700:400}">${fmt(d.net/1000,Math.abs(d.net)>=100000?0:1)}k</text>`;
    g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" style="font-family:var(--f-ui);fill:${cur?'var(--ink)':'var(--muted)'};font-weight:${cur?700:400}">${esc(d.lbl)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net profit over time">${g}</svg>`;
}

const REP_MS=7000;
function repTimer(){clearTimeout(REP.t);if(REP.paused||REP.i>=REP.n-1)return;REP.t=setTimeout(()=>repGo(REP.i+1),REP_MS)}
function repGo(i){if(!REP)return;if(i<0)i=0;if(i>=REP.n){closeReport();return}REP.i=i;
  document.querySelectorAll('#rep .slide').forEach((s,k)=>{s.classList.toggle('on',k===i);s.classList.toggle('past',k<i)});
  document.querySelectorAll('#rep .rep-bar i').forEach((b,k)=>{b.className=k<i?'done':k===i?'cur':'';if(k===i){const x=b.firstChild;x.style.animation='none';void x.offsetWidth;x.style.animation=''}});
  $('#rep').classList.toggle('last',i===REP.n-1);const cur=document.querySelector(`#rep .slide[data-i="${i}"]`);if(cur)countUp(cur);repTimer()}
function repKey(e){if(!REP)return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();repGo(REP.i+1)}else if(e.key==='ArrowLeft')repGo(REP.i-1);else if(e.key==='Escape')closeReport()}
function closeReport(){if(REP)clearTimeout(REP.t);REP=null;document.removeEventListener('keydown',repKey);$('#modalRoot').innerHTML=''}

/* ============================== Optimo control center ============================== */
// Kept apart from the books: Optimo exports live in their own collection and never change the P&L.
// Stock doc  optimo/stock          {kind:'stock',at,file,items:[[barcode,name,category,qty,min,cost,price,vat]]}
// Sales doc  optimo/sales-<from>_<to> {kind:'sales',from,to,file,at,rows:[[barcode,name,qty,cost,revenue,vat]]}
const OP_STATUS={reorder:['bad','Reorder'],soon:['warn','Order soon'],optional:['','Out · slow seller'],negative:['bad','Count is wrong'],dead:['warn','Never sold'],slow:['warn','Too much stock'],ok:['good','OK'],gone:['','Not in stock list']};
function opDocs(){const out={stock:null,sales:[]};S.optimo.forEach((d,id)=>{if(d.kind==='stock')out.stock=d;else if(d.kind==='sales')out.sales.push({...d,id})});out.sales.sort((a,b)=>spanDays(b)-spanDays(a));return out}
const spanDays=d=>Math.max(1,Math.round((Date.parse(d.to)-Date.parse(d.from))/864e5)+1);
const dLabel=s=>{const [y,m,d]=s.split('-');return +d+' '+EN_MONTHS[+m-1].slice(0,3)+' '+y};
function opSettings(){const c=S.cfg.optimo||{};return {cover:+c.cover||3,lead:+c.lead||1}}
function opModel(){
  if(S.mc.has('#op'))return S.mc.get('#op');
  const D=opDocs();if(!D.stock&&!D.sales.length){S.mc.set('#op',null);return null}
  const sel=D.sales.find(x=>x.id===S.op.period)||D.sales[0]||null;
  // the sales rate behind reorder advice comes from the shortest recent export (≥ 30 days), else the selected one
  const stockDay=D.stock?D.stock.at.slice(0,10):today();
  const recent=D.sales.filter(x=>spanDays(x)>=30&&Math.abs(Date.parse(stockDay)-Date.parse(x.to))<=21*864e5).sort((a,b)=>spanDays(a)-spanDays(b));
  const rateDoc=recent[0]||sel;const rateMonths=rateDoc?spanDays(rateDoc)/30.44:1;
  const map=new Map();const get=(b,n)=>{let it=map.get(b);if(!it)map.set(b,it={b,n,cat:'',q:null,min:0,cost:0,price:0,vat:'',sq:0,rev:0,sc:0,sv:0,rq:0});if(n&&!it.n)it.n=n;return it};
  (D.stock?.items||[]).forEach(([b,n,cat,q,min,cost,price,vat])=>{const it=get(b,n);it.n=n;Object.assign(it,{cat,q,min,cost,price,vat})});
  (sel?.rows||[]).forEach(([b,n,q,cost,rev,vat])=>{const it=get(b,n);it.sq+=q;it.rev+=rev;it.sc+=cost;it.sv+=vat});
  if(rateDoc)rateDoc.rows.forEach(([b,n,q])=>{get(b,n).rq+=q});
  const {cover,lead}=opSettings();
  const items=[...map.values()].map(it=>{
    const profit=it.rev-it.sc-it.sv;const rate=it.rq/rateMonths;const inStock=it.q!=null;const q=it.q??0;
    const netPrice=it.vat==='ჩვეულებრივი'?it.price/1.18:it.price;const unit=netPrice-it.cost;
    let status='ok',order=0;const cov=rate>0?Math.max(q,0)/rate:null;
    if(!inStock)status='gone';
    else if(q<0)status='negative';
    else if(q<=0&&rate>0&&rate<1/3)status='optional';
    else if(rate>0&&(q<=0||q<it.min||cov<lead))status='reorder';
    else if(rate>0&&cov<lead+1)status='soon';
    else if(q>0&&it.rq===0&&it.sq===0)status='dead';
    else if(cov!=null&&cov>12)status='slow';
    if(['reorder','soon','negative','optional'].includes(status)&&rate>0)order=Math.max(Math.ceil(rate*cover)-Math.max(q,0),it.min-Math.max(q,0),1);
    return {...it,q,inStock,profit,margin:it.rev?profit/it.rev:null,rate,cov,unit,markup:it.cost?unit/it.cost:null,value:Math.max(q,0)*it.cost,retail:Math.max(q,0)*netPrice,status,order,orderCost:order*it.cost};
  });
  const sum=(arr,k)=>arr.reduce((a,x)=>a+(x[k]||0),0);
  const stocked=items.filter(x=>x.inStock);
  const cats=new Map();items.forEach(x=>{const k=x.inStock?(x.cat||'Other'):'Not in stock list';const c=cats.get(k)||cats.set(k,{n:k,rev:0,profit:0,sq:0,value:0,items:0,reorder:0}).get(k);c.rev+=x.rev;c.profit+=x.profit;c.sq+=x.sq;c.value+=x.value;c.items++;if(x.status==='reorder')c.reorder++});
  const M={D,sel,rateDoc,rateMonths,items,stocked,cats:[...cats.values()].sort((a,b)=>b.rev-a.rev),
    rev:sum(items,'rev'),profit:sum(items,'profit'),sq:sum(items,'sq'),cost:sum(items,'sc'),vat:sum(items,'sv'),
    value:sum(stocked,'value'),retail:sum(stocked,'retail'),units:stocked.reduce((a,x)=>a+Math.max(x.q,0),0),
    reorder:items.filter(x=>x.status==='reorder'),soon:items.filter(x=>x.status==='soon'),optional:items.filter(x=>x.status==='optional'),negative:items.filter(x=>x.status==='negative'),
    dead:items.filter(x=>x.status==='dead'),slow:items.filter(x=>x.status==='slow')};
  M.orderCost=sum(M.reorder,'orderCost');M.deadValue=sum(M.dead,'value')+M.slow.reduce((a,x)=>a+Math.max(0,x.q-Math.ceil(x.rate*12))*x.cost,0);
  S.mc.set('#op',M);return M;
}

function opParse(wb,file){

  const hi=aoa.findIndex(r=>r.some(c=>/ბარკოდი|barcode/i.test(String(c))));if(hi<0)throw {message:file.name+': no barcode column (ბარკოდი) found'};

  const num=v=>typeof v==='number'?v:parseNum(String(v).replace('%',''));

    const MIN=col(/მინიმალური მარაგი/),C=col(/^შესყიდვის ფასი$/),P=col(/^გასაყიდი ფასი$/),K=col(/კატეგორია/);
    const items=body.filter(r=>String(r[B]).trim()).map(r=>[String(r[B]).trim(),String(r[N]).trim(),String(r[K]||'').trim(),num(r[Q]),num(r[MIN]),num(r[C]),num(r[P]),String(r[V]||'').trim()]);
    const d=new Date(file.lastModified||Date.now());
    return {kind:'stock',file:file.name,at:d.toISOString(),items};
  }
  const SC=col(/შესყიდვის ჯამი/),R=col(/ჯამური თანხა/),T=col(/ჯამური დღგ/);
  if(SC<0||R<0)throw {message:file.name+' is not an Optimo sale history or stock list'};
  const rows=body.filter(r=>String(r[B]).trim()&&num(r[Q])).map(r=>[String(r[B]).trim(),String(r[N]).trim(),num(r[Q]),num(r[SC]),num(r[R]),T>=0?num(r[T]):0]);
  const m=file.name.match(/(\d{2})-(\d{2})-(\d{4})[^-]*-\s*(\d{2})-(\d{2})-(\d{4})/);
  const from=m?`${m[3]}-${m[2]}-${m[1]}`:'',to=m?`${m[6]}-${m[5]}-${m[4]}`:today();
  return {kind:'sales',file:file.name,at:new Date().toISOString(),from,to,rows};
}

  const tip=$('#tip');const showTip=(e,html)=>{tip.innerHTML=html;tip.hidden=false;const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8);tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'};
  const hide=()=>tip.hidden=true;
  document.querySelectorAll('#trendSvg .hit').forEach(h=>{h.addEventListener('pointermove',e=>{const d=trendChart.data[+h.dataset.i];showTip(e,`<div class="t">${esc(d.long)}${d.src?' · '+COGS_SRC[d.src]:''}</div><div class="r"><span>Sales</span><b class="num">${gel(d.sales)}</b></div><div class="r"><span>Cost of goods</span><span class="num">${gel(d.cogs)}</span></div><div class="r"><span>Running costs</span><span class="num">${gel(d.opex)}</span></div><div class="r"><span>Taxes</span><span class="num">${gel(d.tax)}</span></div><div class="r"><span>Net profit</span><b class="num ${d.net<0?'neg':''}">${gel(d.net)}</b></div>`)});h.addEventListener('pointerleave',hide);h.addEventListener('click',()=>{hide();const d=trendChart.data[+h.dataset.i];if(d.isYear)setRange({p:'year',y:d.m});else setMonth(d.m)})});
  document.querySelectorAll('#dailySvg .dhit').forEach(h=>{h.addEventListener('pointermove',e=>showTip(e,`<div class="t">${h.dataset.d} ${mLabel(S.month)}</div><div class="r"><span>Sales</span><b class="num">${gel(+h.dataset.v)}</b></div><div class="r"><span>vs 1,000 ₾ target</span><span class="num">${pct(+h.dataset.v,1000)}%</span></div>`));h.addEventListener('pointerleave',hide)});
  document.querySelectorAll('#mapSvg .mdot').forEach(c=>{c.addEventListener('pointermove',e=>{const r=marginMap.pts[+c.dataset.i];showTip(e,`<div class="t">${esc(r.n)}</div><div class="r"><span>Sold</span><span class="num">${fmt(r.q)} pcs</span></div><div class="r"><span>Revenue</span><span class="num">${gel(r.r)}</span></div><div class="r"><span>Cost</span><span class="num">${gel(r.k)}</span></div><div class="r"><span>Profit</span><b class="num ${r.p<0?'neg':''}">${gel(r.p)}</b></div><div class="r"><span>Margin</span><b class="num">${pct(r.p,r.r)}%</b></div>`);c.setAttribute('fill-opacity','.9')});c.addEventListener('pointerleave',()=>{hide();c.setAttribute('fill-opacity','.55')})});
  hide();
  const on=(sel,ev,fn)=>{const el=$(sel);if(el)el.addEventListener(ev,fn)};
  const searchBox=(id,setter)=>{let t;on(id,'input',e=>{clearTimeout(t);t=setTimeout(()=>{setter(e.target.value);render();const x=$(id);x.focus();x.setSelectionRange(x.value.length,x.value.length)},250)})};
  searchBox('#xQ',v=>S.filters.q=v);searchBox('#sQ',v=>S.salesQ=v);searchBox('#pQ',v=>S.prod.q=v);
  on('#xCat','change',e=>{S.filters.cat=e.target.value;render()});on('#xAcct','change',e=>{S.filters.acct=e.target.value;render()});on('#xAll','change',e=>{S.filters.all=e.target.checked;render()});
  document.querySelectorAll('[data-edit]').forEach(r=>r.onclick=()=>{
    const id=r.dataset.edit;let t=S.tx.get(id);
    if(!t){t=txOf(r.dataset.m).find(x=>x.id===id);if(!t)return;S.draft={date:t.date,cur:'GEL',amount:String(t.gel),fx:fx(),cat:t.cat,account:t.account,vendor:t.vendor,note:'',employee:t.employee||'',recId:t.recId,source:'fixed'}}
    else S.draft={...t,amount:String(t.cur==='USD'?t.orig:t.gel),fx:t.fx||fx(),employee:t.employee||'',vendor:t.vendor||'',note:t.note||'',account:t.account||'unknown'};
    S.view='add';S.animate=true;render();window.scrollTo({top:0})});
  document.querySelectorAll('[data-payacc]').forEach(el=>el.onchange=async()=>{try{await saveCfg({payAcct:{...(S.cfg.payAcct||{}),[el.dataset.payacc]:el.value}});toast(PAYS[el.dataset.payacc]+' → '+(el.value?BAL_ACC.find(x=>x[0]===el.value)[1]:'not counted'))}catch(e){toast(errMsg(e))}});
  on('#opFile','change',e=>{if(e.target.files.length)opUpload(e.target.files)});
  const opD=$('.drop[data-act="opPick"]');if(opD){opD.addEventListener('dragover',e=>{e.preventDefault();opD.classList.add('over')});opD.addEventListener('dragleave',()=>opD.classList.remove('over'));opD.addEventListener('drop',e=>{e.preventDefault();opD.classList.remove('over');if(e.dataTransfer.files.length)opUpload(e.dataTransfer.files)})}
  searchBox('#oQ',v=>{S.op.q=v;S.op.full=false});
  on('#oCat','change',e=>{S.op.cat=e.target.value;render()});on('#oStatus','change',e=>{S.op.status=e.target.value;render()});
  on('#opPeriod','change',e=>{S.op.period=e.target.value;S.mc=new Map();render()});
  const opNum=(id,k)=>on(id,'change',async e=>{const v=parseNum(e.target.value);if(!(v>0))return;try{await saveCfg({optimo:{...(S.cfg.optimo||{}),[k]:v}})}catch(x){toast(errMsg(x))}});opNum('#opCover','cover');opNum('#opLead','lead');
  document.querySelectorAll('th[data-osort]').forEach(th=>th.onclick=()=>{const k=th.dataset.osort;if(S.op.sort===k)S.op.dir*=-1;else{S.op.sort=k;S.op.dir=k==='n'||k==='status'?1:-1}render()});
  document.querySelectorAll('[data-opcat]').forEach(r=>r.onclick=()=>{S.op.cat=r.dataset.opcat;S.op.tab='items';S.op.status='';S.animate=true;render()});
  on('#backupFile','change',e=>{const f=e.target.files[0];if(f)importBackup(f)});
  on('#rYear','change',e=>{if(e.target.value)setRange({p:'year',y:e.target.value})});
  on('#rFrom','change',e=>setRange({p:'custom',from:e.target.value,to:$('#rTo').value}));
  on('#rTo','change',e=>setRange({p:'custom',from:$('#rFrom').value,to:e.target.value}));
  on('#cnGo','click',async()=>{const u=$('#cnU').value.trim(),k=$('#cnK').value.trim();const msg=$('#cnMsg');if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){msg.textContent='That doesn’t look like an Apps Script web-app URL';return}msg.textContent='Checking…';
    try{await gasCall(u,k,{action:'ping'});lsSet('af.backend',JSON.stringify({u,k}));msg.textContent='Connected';S.view='overview';connectBackend({u,k});render()}catch(e){msg.textContent=e.message||'Could not connect'}});
  on('#ordersFile','change',e=>{const f=e.target.files[0];if(f)readFile(f,wb=>{S.salesPreview=parseOrdersWorkbook(wb,f.name,true);openSalesPreview()})});
  document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;if(S.prod.sort===k)S.prod.dir*=-1;else{S.prod.sort=k;S.prod.dir=k==='n'?1:-1}render()});
  // drop zones
  const dz=(dropSel,fileSel,handler)=>{const d=$(dropSel);if(!d)return;const pick=()=>$(fileSel).click();d.addEventListener('click',pick);d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}});
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});d.addEventListener('dragleave',()=>d.classList.remove('over'));
    d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)handler(f)});on(fileSel,'change',e=>{const f=e.target.files[0];if(f)handler(f)})};
  dz('#bDrop','#bFile',f=>{const acct=$('#bAcct').value;lsSet('af.bacct',acct);readFile(f,wb=>bankLoad(wb,f.name,acct))});
  dz('#oDrop','#oFile',f=>{S.opt.month=$('#oMonth').value;readFile(f,wb=>optLoad(wb,f.name))});
  on('#oMonth','change',e=>S.opt.month=e.target.value);
  document.querySelectorAll('[data-omap]').forEach(s=>s.onchange=()=>{S.opt.map[s.dataset.omap]=+s.value;render()});
  document.querySelectorAll('[data-map]').forEach(s=>s.onchange=()=>{S.bank.map[s.dataset.map]=+s.value});
  document.querySelectorAll('[data-bi]').forEach(c=>c.onchange=()=>{S.bank.items[+c.dataset.bi].include=c.checked;updBankTotal()});
  document.querySelectorAll('[data-bc]').forEach(s=>s.onchange=()=>{const it=S.bank.items[+s.dataset.bc];it.cat=s.value;if(s.value&&!it.dup){it.include=true;const cb=document.querySelector(`[data-bi="${s.dataset.bc}"]`);if(cb)cb.checked=true}updBankTotal()});
  on('#bAll','change',e=>{S.bank.items.forEach((it,i)=>{if(!it.dup){it.include=e.target.checked;const cb=document.querySelector(`[data-bi="${i}"]`);if(cb)cb.checked=e.target.checked}});updBankTotal()});
  on('#bRemember','change',e=>S.bank.remember=e.target.checked);on('#bBal','change',e=>S.bank.saveBal=e.target.checked);
  document.querySelectorAll('[data-ship]').forEach(r=>r.onclick=()=>shipModal(r.dataset.ship));
  document.querySelectorAll('[data-rmfx]').forEach(b=>b.onclick=()=>{const f=readFixedForm();f.splice(+b.dataset.rmfx,1);S.fixedDraft=f;S.cfg={...S.cfg,fixed:f};render()});
  document.querySelectorAll('[data-rmrule]').forEach(b=>b.onclick=async()=>{try{await delDoc('rules/'+b.dataset.rmrule)}catch(e){toast(errMsg(e))}});
  document.querySelectorAll('[data-act]').forEach(b=>{if(b.tagName==='DIV'&&b.classList.contains('drop'))b.addEventListener('keydown',e=>{if(e.key==='Enter')act(b.dataset.act,b)});b.onclick=e=>act(b.dataset.act,b,e)});
}
function readFixedForm(){const list=fixedList().map(f=>({...f}));document.querySelectorAll('[data-fx]').forEach(el=>{const f=list[+el.dataset.fx];if(!f)return;const k=el.dataset.k;f[k]=k==='gel'?parseNum(el.value):el.value.trim()});return list}
async function act(a,b){
  try{
  if(a==='syncSheet'){if(!S.mcp&&!S.backend){toast('Live sync needs Google Drive connected (in Claude) or the hosted version');return}return syncSheet(b)}
  if(a==='pickOrders')return $('#ordersFile').click();
  if(a==='opPick')return $('#opFile')?$('#opFile').click():null;
  if(a==='opTab'){S.op.tab=b.dataset.v;S.animate=true;render();window.scrollTo({top:0});return}
  if(a==='opRank'){S.op.rank=b.dataset.v;return render()}
  if(a==='opFull'){S.op.full=true;return render()}
  if(a==='opMore'){S.op['all'+b.dataset.v]=true;return render()}
  if(a==='opExport')return opExport();
  if(a==='bankReset'){S.bank=null;S.animate=true;return render()}
  if(a==='bankReview')return bankBuild();
  if(a==='bankSave')return bankSave(b);
  if(a==='exportXlsx')return exportXlsx();
  if(a==='newShip')return shipModal();
  if(a==='optStart')return optStart();
  if(a==='optCancel'||a==='optReset'){S.opt=a==='optReset'?{stage:'upload',month:S.opt.month}:null;S.animate=true;return render()}
  if(a==='optSave')return optSave(b);
  if(a==='optDelete'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to remove';return}await delDoc('items/'+S.month);return toast('Removed the Optimo report for '+mLabel(S.month))}
  if(a==='prodFull'){S.prod.full=true;return render()}
  if(a==='prodAll'){S.prod.full=false;S.prod.all=b.dataset.v==='1';S.animate=true;return render()}
  if(a==='prodTab'){S.prod.tab=b.dataset.v;const D=prodData(S.prod.all?rangeMonths():[S.month]);document.querySelectorAll('[data-act="prodTab"]').forEach(x=>x.setAttribute('aria-selected',x===b));const el=$('#rankBars');el.innerHTML=rankBars(rankItems(D.rows,S.prod.tab),S.prod.tab);if(!reduced()){el.parentElement.classList.add('anim');el.querySelectorAll('.fill').forEach((f,j)=>f.style.setProperty('--j',j))}return}
  if(a==='report')return openReport(S.month);
  if(a==='plMode'){S.plMode=b.dataset.v;S.animate=true;return render()}
  if(a==='plYtd'||a==='plRange'){S.plMode='range';return go('pl')}
  if(a==='range'){const p=b.dataset.p;const R={p};if(p==='custom'){const ms=rangeMonths();R.from=ms[0];R.to=ms[ms.length-1]}if(p==='month'&&S.view==='pl'){S.plMode='month'}return setRange(R)}
  if(a==='expMode'){S.filters.all=b.dataset.v==='1';S.animate=true;return render()}
  if(a==='filterCat'){S.filters.q=catLabel(b.dataset.cat);S.filters.all=false;return go('expenses')}
  if(a==='filterFixed'){S.filters.q='';S.filters.all=false;return go('expenses')}
  if(a==='saveGeneral'){await saveCfg({fx:parseNum($('#cFx').value)||2.7,method:$('#cMethod').value,sheetId:$('#cSheet').value.trim(),loanBalance:parseNum($('#cLoan').value)||null});return toast('Settings saved')}
  if(a==='saveBal'){const bal={...(S.cfg.balances||{})};const LB=liveBalances();
    // only an amount you changed restarts that account from today
    document.querySelectorAll('[data-bal]').forEach(el=>{const k=el.dataset.bal;if(el.value.trim()==='')return;const v=parseNum(el.value);const o=LB[k];if(o&&Math.abs(o.now-v)<0.01)return;bal[k]={gel:v,asOf:today(),at:new Date().toISOString(),parts:[]}});
    await saveCfg({balances:bal,loan:{label:$('#lLabel').value.trim()||'Loan',amount:parseNum($('#lAmt').value),owed:parseNum($('#lOwed').value)}});return toast('Balances and loan saved')}
  if(a==='exportBackup')return exportBackup();
  if(a==='pickBackup')return $('#backupFile').click();
  if(a==='copyPhone'){const v=$('#phLink').value;try{await navigator.clipboard.writeText(v);toast('Phone link copied')}catch(e){$('#phLink').select();toast('Select and copy the link')}return}
  if(a==='disconnect'){if(S.backend&&S.backend.pending()){toast('Some changes are still saving. Wait until it says “Saved to Google”.');return}lsSet('af.backend','');lsSet(CACHE,'');location.reload();return}
  if(a==='connect'){return}
  if(a==='addFixed'){const f=readFixedForm();f.push({id:uid('f'),label:'New fixed cost',cat:'misc',gel:0,account:'bog',match:'',from:thisMonth()});S.cfg={...S.cfg,fixed:f};return render()}
  if(a==='saveFixed'){const f=readFixedForm().filter(x=>x.label);await saveCfg({fixed:f});return toast('Fixed costs saved · '+gel(f.reduce((s,x)=>s+(+x.gel||0),0))+' a month')}
  }catch(e){toast(errMsg(e))}
}
boot();
</script>
