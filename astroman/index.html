// The register (astroman/store/) writes `pos` (one record per sale) and `shift` records with its own limited
// key; the catalog it sells from is the `catalog` collection, managed here. Nothing here touches the books.
const POSPAY={cash:'Cash',pos:'Card terminal',bog:'BOG transfer',tbc:'TBC transfer',wolt:'Wolt',glovo:'Glovo',extra:'Extra.ge',cod:'Cash on delivery',personal:'Rezi personal account',pending:'Awaiting transfer',installment:'Installments',other:'Other',card_bog:'BOG terminal',card_tbc:'TBC terminal',transfer:'Transfer'};
const POS_CARD=new Set(['pos','card_bog','card_tbc']);
const posInitials=n=>String(n||'').replace(/[^\p{L}\p{N}]/gu,'').slice(0,2).toUpperCase()||'·';
function thumb(x,s){s=s||36;return x&&x.img?`<img class="thumb" src="${esc(x.img)}" alt="" loading="lazy" style="width:${s}px;height:${s}px" onerror="this.outerHTML='<span class=\\'thumb ph\\' style=\\'width:${s}px;height:${s}px\\'>${esc(posInitials(x.n))}</span>'">`:`<span class="thumb ph" style="width:${s}px;height:${s}px">${esc(posInitials(x&&x.n))}</span>`}
function posOrders(day){return [...S.pos.values()].filter(o=>o&&o.lines&&(!day||o.day===day)).sort((a,b)=>String(b.at).localeCompare(String(a.at)))}
function regDay(d){const L=posOrders(d).filter(o=>o.status!=='void');return {n:L.length,a:L.reduce((s,o)=>s+(+o.total||0),0),L}}
function storeDir(){return location.origin+location.pathname.replace(/[^/]*$/,'')+'store/'}
function storeLink(){const c=readCreds();const k=S.cfg.pos&&S.cfg.pos.key;if(!c||!k)return '';const b=btoa(unescape(encodeURIComponent(JSON.stringify({u:c.u,k})))).replace(/\+/g,'-').replace(/\//g,'_');return storeDir()+'#connect='+b}
const storeQ=x=>x.qs!=null?+x.qs||0:(+x.q||0);
const whQ=x=>+x.qw||0;
function catLive(x){let q=storeQ(x);const c=String(x.countedAt||'');S.pos.forEach(o=>{if(o.status==='void'||!o.lines)return;if(c&&(c.length>10?String(o.at||'')<c:(o.day||'')<c))return;o.lines.forEach(l=>{if(l.b===x.b)q-=+l.q||0})});return q}

function storeLive(){
  const t=today();const d=S.store.day&&S.store.day<=t?S.store.day:t;const isT=d===t;const R=regDay(d);const all=posOrders(d);

  <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:14px"><div><div class="eyebrow"><span class="dot"></span>${isT?'Today':'Day view'} · ${KA_DAYS[new Date(d+'T12:00').getDay()]}</div><h2 style="margin:0;font-family:var(--f-display);font-size:22px">${dLong(d)}</h2></div><span class="spacer"></span>

   ${top.length?`<div class="panel mt"><h2>Sold today</h2><div class="flow">${top.map(it=>`<div class="ln"><span class="k row" style="gap:8px">${thumb(it,30)}<span><b>${esc(it.n)}</b><div class="small muted">×${fmt(it.q)}</div></span></span><span class="v num">${gel(it.a)}</span></div>`).join('')}</div></div>`:''}</div></div>`;

function dtShort(iso){if(!iso)return '—';const d=new Date(iso);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function tOf(iso){const d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function shiftExpected(s){let cash=0;S.pos.forEach(o=>{if(o.shift===s.id&&o.status!=='void'&&o.pay==='cash')cash+=+o.total||0});const mv=(s.moves||[]).reduce((a,m)=>a+(m.kind==='in'?1:-1)*(+m.gel||0),0);return r2((+s.openCash||0)+cash+mv)}
function storeOrderRow(o){return `<div class="orow click ${o.status==='void'?'void':''}" data-act="st_order" data-id="${esc(o.id)}" style="cursor:pointer"><span class="ob"><span class="op">${esc(o.lines.map(l=>(l.q>1?l.q+'× ':'')+l.n).join(', '))}</span><small>${tOf(o.at)} · №${o.no||''} · ${esc(o.user?o.user.name:'?')}${o.status==='void'?' · <b style="color:var(--bad)">voided</b>':''}${o.note?' · '+esc(o.note):''}</small></span><span class="chip">${esc(POSPAY[o.pay]||o.pay)}</span><b class="num">${gel(o.total,o.total%1?2:0)}</b></div>`}
function storeOrderModal(id){

function siteScore(name,p){const t=s=>String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim().split(' ').filter(Boolean);const A=new Set(t(name)),B=new Set(t(p.n));let sh=0;A.forEach(w=>{if(B.has(w))sh+=w.length});const nm=name.toLowerCase(),pn=p.n.toLowerCase();return sh/Math.max(1,[...A].join('').length)+(pn.includes(nm)||nm.includes(pn)?1:0)}

// A picture dropped, chosen or pasted into the product modal: shrunk in the browser, stored by the backend in

function bindPictureDrop(){
  const z=$('#ceDrop'),f=$('#ceFile');if(!z||!f)return;const code=z.dataset.b;
  const take=file=>{if(file&&/^image\//.test(file.type))productPicture(file,code,z)};
  z.onclick=()=>f.click();f.onchange=()=>{take(f.files[0]);f.value=''};
  z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');
  z.ondrop=e=>{e.preventDefault();z.classList.remove('over');take(e.dataTransfer.files[0])};
  document.onpaste=e=>{if(!$('#ceDrop'))return;const it=[...(e.clipboardData||{}).items||[]].find(i=>i.type.startsWith('image/'));if(it)take(it.getAsFile())};
}
function shrinkImage(file,max){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.86).split(',')[1])};img.onerror=()=>rej({message:'Not an image'});img.src=u})}
async function productPicture(file,code,zone){
  const c=readCreds();if(!c){toast('Pictures can be stored in the hosted version only');return}
  zone.classList.add('busy');toast('Storing the picture…');
  try{const b64=await shrinkImage(file,800);const name=(code&&S.catalog.get(code)?S.catalog.get(code).n:file.name.replace(/\.[^.]+$/,''));
    const r=await gasCall(c.u,c.k,{action:'image_put',name,b64,mime:'image/jpeg'});if(!r||!r.url)throw {message:'The backend did not store the picture'};
    const inp=$('#ceImg');if(inp)inp.value=r.url;zone.innerHTML=`<img src="${esc(r.url)}" alt=""><span class="pdhint">drop a picture · click · paste</span>`;
    if(code&&S.catalog.has(code)){await saveCat(code,{img:r.url,big:r.url,wooId:null,imgSrc:'drive'});delete S.catalog.get(code).noImg;toast('Picture saved')}else toast('Picture ready — press Save')}
  catch(e){toast(/unknown action/.test(e.message||'')?'The backend still runs the old script — paste the new Code.gs and deploy a new version':(e.message||'Could not store the picture'))}

const BRANCH=/ფილიალი/i;
function sheetStoreRows(d){return dayOf(d).rows.filter(r=>BRANCH.test(String(r.c||'')))}
function recon(d){
  const sheet=sheetStoreRows(d).map((r,i)=>({i,a:+r.a||0,p:r.p||'',pay:r.pay}));
  const reg=posOrders(d).filter(o=>o.status!=='void').map(o=>({id:o.id,a:+o.total||0,p:o.lines.map(l=>(l.q>1?l.q+'× ':'')+l.n).join(', '),pay:o.pay,no:o.no,t:tOf(o.at)}));
  const used=new Set();const pairs=[];
  reg.forEach(o=>{const j=sheet.findIndex(s=>!used.has(s.i)&&Math.abs(s.a-o.a)<0.01);if(j>=0){used.add(sheet[j].i);pairs.push([o,sheet[j]])}});
  const sheetOnly=sheet.filter(s=>!used.has(s.i)),regOnly=reg.filter(o=>!pairs.some(p=>p[0]===o));
  const sa=sheet.reduce((x,s)=>x+s.a,0),ra=reg.reduce((x,o)=>x+o.a,0);
  return {sheet,reg,pairs,sheetOnly,regOnly,sa,ra,ok:!sheetOnly.length&&!regOnly.length,diff:r2(ra-sa)};
}

/* ---------- duplicates ---------- */
const nrm=s=>String(s||'').toLowerCase().replace(/[„“”"'’`()\[\],.:;!?/\\\-–—×]+/g,' ').replace(/\s+/g,' ').trim();
const isWeb=x=>/^W\d+$/.test(String(x.b));
function dupGroups(){
  const all=[...S.catalog.values()].filter(x=>x&&x.b);const groups=[];const seen=new Set();
  const byWoo=new Map();all.forEach(x=>{if(x.wooId)byWoo.set(x.wooId,(byWoo.get(x.wooId)||[]).concat(x))});
  byWoo.forEach(g=>{if(g.length<2)return;const web=g.filter(isWeb),opt=g.filter(x=>!isWeb(x));
    if(web.length&&opt.length){const grp=opt.concat(web);groups.push(grp);grp.forEach(x=>seen.add(x.b))}
    else{const byN=new Map();g.forEach(x=>{const k=nrm(x.n);byN.set(k,(byN.get(k)||[]).concat(x))});byN.forEach(h=>{if(h.length>1){groups.push(h);h.forEach(x=>seen.add(x.b))}})}});
  const byN=new Map();all.forEach(x=>{if(seen.has(x.b))return;const k=nrm(x.n);byN.set(k,(byN.get(k)||[]).concat(x))});
  byN.forEach(h=>{if(h.length>1)groups.push(h)});
  return groups;
}
function dupModal(){
  const G=dupGroups();
  modal(`<h3>Possible duplicates</h3><p class="sub">${G.length?G.length+' group'+(G.length===1?'':'s')+': a website copy next to the Optimo record, or two records with one name. Choose the record to keep; the others’ store, warehouse and sales are added to it and they are removed. Size variants that share one picture are not listed.':'No duplicates found.'}</p>
   ${G.map((g,gi)=>{const keep=g.slice().sort((a,b)=>(isWeb(a)?1:0)-(isWeb(b)?1:0)||(b.sold||0)-(a.sold||0))[0];return `<div class="panel" style="padding:12px;margin-bottom:10px"><div class="flow">${g.map(x=>`<label class="ln" style="cursor:pointer"><span class="k row" style="gap:8px"><input type="radio" name="dup${gi}" value="${esc(x.b)}" ${x===keep?'checked':''}>${thumb(x,34)}<span><b>${esc(x.n)}</b><div class="small muted">${esc(x.b)} · ${esc(x.cat||'')} · ${gel(x.price)} · store ${catLive(x)} · wh ${whQ(x)} · sold ${fmt(x.sold||0)}</div></span></span></label>`).join('')}</div><div class="row mt"><span class="muted small">Keep the ticked one</span><span class="spacer"></span><button class="btn sm primary" data-act="st_merge" data-g="${gi}" data-codes="${esc(g.map(x=>x.b).join('|'))}">Merge</button></div></div>`}).join('')}
   <div class="row"><span class="spacer"></span><button class="btn" data-close>Close</button></div>`,true);
}
async function mergeGroup(gi,codes){
  const el=document.querySelector(`input[name="dup${gi}"]:checked`);if(!el)return;const keepB=el.value;
  const docs=codes.map(b=>S.catalog.get(b)).filter(Boolean);const keep=docs.find(x=>x.b===keepB);if(!keep)return;
  const others=docs.filter(x=>x!==keep);const sum=k=>docs.reduce((a,x)=>a+(+x[k]||0),0);const first=k=>keep[k]||others.map(x=>x[k]).find(Boolean)||null;
  const patch={qw:sum('qw'),q:sum('q'),sold:sum('sold'),img:first('img'),big:first('big'),wooId:first('wooId'),price:keep.price||first('price')||0,cost:keep.cost||first('cost')||0,
    storeNote:[keep.storeNote,...others.map(x=>x.storeNote)].filter(Boolean).join(' · '),merged:(keep.merged||[]).concat(others.map(x=>x.b))};
  // only counted store quantities add up; an Optimo count on an uncounted record would double the stock
  const counted=docs.filter(x=>x.qs!=null);if(counted.length){patch.qs=counted.reduce((a,x)=>a+(+x.qs||0),0);patch.countedAt=counted.map(x=>String(x.countedAt||'')).sort().pop()}
  await saveCat(keep.b,patch);for(const x of others)await S.db.doc('catalog/'+x.b).delete();
  toast('Merged into '+keep.n);dupModal();
}

  return `<div class="panel stack"><h2>Website stock (astroman.ge)</h2><p class="sub" style="margin:0">Twice a day the backend marks every product in the register catalog as <b>in stock</b> or <b>out of stock</b> on astroman.ge, from the store and warehouse counts together. Needs a WordPress application password (wp-admin → Users → Profile → Application Passwords); it is kept in the backend script, never on this page.</p>
   <div class="grid g2"><label class="field"><span>WordPress user</span><input class="input" id="siUser" autocomplete="off" placeholder="LTDastroman"></label><label class="field"><span>Application password</span><input class="input" id="siPass" type="password" autocomplete="off" placeholder="xxxx xxxx xxxx xxxx"></label></div>
   <label class="row"><input type="checkbox" id="siOn" ${st.enabled?'checked':''}> Sync automatically twice a day</label>
   <div class="row" style="flex-wrap:wrap"><button class="btn primary" data-act="si_save">Save</button><button class="btn" data-act="si_test">Test connection</button><button class="btn" data-act="si_sync">Sync now</button><span class="muted small" id="siMsg" aria-live="polite"></span></div>
   <div class="small muted">${last?`Last sync ${dtShort(last.at)}${last.manual?' (manual)':''}: ${last.error?'<span style="color:var(--bad)">'+esc(last.error)+'</span>':fmt(last.updated)+' products updated, '+fmt(last.outofstock||0)+' marked out of stock'}`:'Not synced yet.'}</div></div>`;
}
async function siteAct(a,b){
  const c=readCreds();const m=$('#siMsg');if(!c){if(m)m.textContent='Hosted version only';return}
  if(a==='si_save'){const user=$('#siUser').value.trim(),pass=$('#siPass').value.trim(),enabled=$('#siOn').checked;m.textContent='Saving…';
    try{const r=await gasCall(c.u,c.k,{action:'site_setup',user,pass,enabled});await saveCfg({site:{...(S.cfg.site||{}),enabled}});m.textContent=(r.hasUser&&r.hasPass?'Saved. ':'Saved, but the user or password is still missing. ')+(enabled?'Automatic sync is on.':'Automatic sync is off.');$('#siPass').value=''}
    catch(e){m.textContent=/unknown action/.test(e.message||'')?'The backend still runs the old script — paste the new Code.gs and deploy a new version':(e.message||'Failed')}return}
  if(a==='si_test'){m.textContent='Testing…';try{const r=await gasCall(c.u,c.k,{action:'site_test'});m.textContent='Connected to astroman.ge'+(r.sample?' (first product: '+r.sample+')':'')}catch(e){m.textContent=/unknown action/.test(e.message||'')?'The backend still runs the old script':(e.message||'Failed')}return}
  if(a==='si_sync'){m.textContent='Syncing — up to a minute…';b.disabled=true;try{const r=await gasCall(c.u,c.k,{action:'site_sync'});m.textContent=r.error?'Failed: '+r.error:fmt(r.updated)+' products updated, '+fmt(r.outofstock||0)+' out of stock';if(S.backend)S.backend.load().catch(()=>{})}catch(e){m.textContent=e.message||'Failed'}b.disabled=false;return}
}

function loadQr(){if(window.qrcode)return Promise.resolve();return loadQr.p||(loadQr.p=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';sc.onload=res;sc.onerror=()=>{loadQr.p=null;rej()};document.head.appendChild(sc)}))}
function drawPhoneQr(){const el=$('#phQr');if(!el)return;const v=phoneLink();if(!v){el.remove();return}
  loadQr().then(()=>{const q=window.qrcode(0,'M');q.addData(v);q.make();const box=$('#phQr');if(box)box.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true})}).catch(()=>{const box=$('#phQr');if(box)box.closest('.qrbox').hidden=true})}
function readFixedForm(){const list=fixedList().map(f=>({...f}));document.querySelectorAll('[data-fx]').forEach(el=>{const f=list[+el.dataset.fx];if(!f)return;const k=el.dataset.k;f[k]=k==='gel'?parseNum(el.value):el.value.trim()});return list}
async function act(a,b){
  try{
  if(a==='syncSheet'){if(!S.mcp&&!S.backend){toast('Live sync needs Google Drive connected (in Claude) or the hosted version');return}return syncSheet(b)}
  if(a.startsWith('st_')||a.startsWith('si_')){const r=await storeAct(a,b);if(r!==false)return}

  if(a==='opPick')return $('#opFile')?$('#opFile').click():null;
  if(a==='opTab'){S.op.tab=b.dataset.v;S.animate=true;render();window.scrollTo({top:0});return}
  if(a==='opRank'){S.op.rank=b.dataset.v;return render()}
  if(a==='opFull'){S.op.full=true;return render()}

  if(a==='bankReview')return bankBuild();
  if(a==='bankSave')return bankSave(b);
  if(a==='exportXlsx')return exportXlsx();
  if(a==='newShip'||a==='newOrder'||a==='invOrder'||a.startsWith('imp')||a.startsWith('ship')||a==='payShip'||a==='linkShip'){const r=await impAct(a,b);if(r!==false)return}
  if(a==='optStart')return optStart();

  if(a==='optSave')return optSave(b);
  if(a==='optDelete'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to remove';return}await delDoc('items/'+S.month);return toast('Removed the Optimo report for '+mLabel(S.month))}
  if(a==='prodFull'){S.prod.full=true;return render()}
  if(a==='prodAll'){S.prod.full=false;S.prod.all=b.dataset.v==='1';S.animate=true;return render()}
  if(a==='prodTab'){S.prod.tab=b.dataset.v;const D=prodData(S.prod.all?rangeMonths():[S.month]);document.querySelectorAll('[data-act="prodTab"]').forEach(x=>x.setAttribute('aria-selected',x===b));const el=$('#rankBars');el.innerHTML=rankBars(rankItems(D.rows,S.prod.tab),S.prod.tab);if(!reduced()){el.parentElement.classList.add('anim');el.querySelectorAll('.fill').forEach((f,j)=>f.style.setProperty('--j',j))}return}
  if(a==='deeper'){const k=b.dataset.k;if(k==='year'){S.plMode='range';return go('pl')}const m=S.month,M=metrics(m),P=metrics(addMonth(m,-1));
    const html={pay:()=>channels(M),items:()=>topItemsPanel(M),cats:()=>breakdown(M,P),cal:()=>calendarPanel(m,M)}[k]();
    modal(`<div class="deepm">${html}</div><div class="foot"><span></span><button class="btn" data-close>Close</button></div>`);
    document.querySelectorAll('#modalRoot [data-day]').forEach(x=>x.onclick=()=>{S.day=x.dataset.day;closeModal();render();const T=$('#today');if(T)T.scrollIntoView({block:'start'})});return}
  if(a==='report')return openRecap('month',S.month);
  if(a==='recap')return openRecap('month');
  if(a==='recapClose')return closeRecap();
  if(a==='plMode'){S.plMode=b.dataset.v;S.animate=true;return render()}
  if(a==='plYtd'||a==='plRange'){S.plMode='range';return go('pl')}
  if(a==='range'){const p=b.dataset.p;const R={p};if(p==='custom'){const ms=rangeMonths();R.from=ms[0];R.to=ms[ms.length-1]}if(p==='month'&&S.view==='pl'){S.plMode='month'}return setRange(R)}
  if(a==='expMode'){S.filters.all=b.dataset.v==='1';S.animate=true;return render()}
  if(a==='prodView'){S.prod.view=b.dataset.v;S.animate=true;return render()}
  if(a==='psFilter'){S.prod.sf=b.dataset.v;S.prod.sfull=false;return render()}
  if(a==='psFull'){S.prod.sfull=true;return render()}
  if(a==='shipFromTx'){const t=S.tx.get(b.dataset.id);if(!t)return;const u=usdOfTx(t);return orderModal(null,{date:t.date,supplier:t.vendor||'',cur:'USD',fx:u?Math.round(t.gel/u*10000)/10000:fx(),linkTx:t.id,note:'Paid '+t.date+' · '+gel(t.gel,2)})}

  if(a==='saveBal'){const bal={...(S.cfg.balances||{})};const LB=liveBalances();
    // only an amount you changed restarts that account from today
    document.querySelectorAll('[data-bal]').forEach(el=>{const k=el.dataset.bal;if(el.value.trim()==='')return;const v=parseNum(el.value);const o=LB[k];if(o&&Math.abs(o.now-v)<0.01)return;bal[k]={gel:v,asOf:today(),at:new Date().toISOString(),parts:[]}});

  if(a==='loanCount')return loanCount();
  if(a==='loanLeft')return loanLeft();
  if(a==='loanLeftClear'){const {left,...rest}=S.cfg.loan||{};return saveCfg({loan:rest}).then(()=>{schedule();toast('Left now comes from the entries')},x=>toast(errMsg(x)))}
  if(a==='exportBackup')return exportBackup();
  if(a==='pickBackup')return $('#backupFile').click();
  if(a==='copyPhone'){const v=$('#phLink').value;try{await navigator.clipboard.writeText(v);toast('Phone link copied')}catch(e){$('#phLink').select();toast('Select and copy the link')}return}
  if(a==='disconnect'){if(S.backend&&S.backend.pending()){toast('Some changes are still saving. Wait until it says “Saved to Google”.');return}lsSet('af.backend','');lsSet(CACHE,'');location.reload();return}
  if(a==='connect'){return}
  if(a==='addFixed'){const f=readFixedForm();f.push({id:uid('f'),label:'New fixed cost',cat:'misc',gel:0,account:'bog',match:'',from:thisMonth()});S.cfg={...S.cfg,fixed:f};return render()}
  if(a==='saveFixed'){const f=readFixedForm().filter(x=>x.label);await saveCfg({fixed:f});return toast('Fixed costs saved · '+gel(f.reduce((s,x)=>s+(+x.gel||0),0))+' a month')}
  }catch(e){toast(errMsg(e))}
}
boot();
</script>

</body>
</html>
